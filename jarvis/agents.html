<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Command Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #2a2d57;
  --bg2: #3d4378;
  --ink: #f2f0ff;
  --muted: #a9acd6;
  --line: rgba(255,255,255,.14);
  --panel: #23264a;
  --field: #1b1d3b;
  --accent: #c9b8ff;
  --ok: #8ff0c0;
  --err: #ff8f8f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Space Grotesk', system-ui, sans-serif;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% 40%, var(--bg2), var(--bg1) 70%) fixed, var(--bg1);
  overflow-x: hidden;
}
button { font: inherit; cursor: pointer; color: inherit; }
input, textarea, select {
  font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
}
textarea { resize: vertical; }
label { display: block; font-size: .8rem; color: var(--muted); margin: 10px 0 4px; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line);
  background: linear-gradient(90deg, rgba(120,90,200,.25), rgba(120,90,200,.05));
}
.brand { font-family: 'Cinzel', serif; font-size: 1.25rem; letter-spacing: .3em; }
.brand small { display: block; font-family: 'Space Grotesk'; letter-spacing: .05em; font-size: .72rem; color: var(--muted); }
.seg { display: flex; background: rgba(0,0,0,.25); border-radius: 8px; padding: 3px; }
.seg button {
  background: none; border: 0; padding: 6px 12px; border-radius: 6px;
  font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.seg button.on { background: #e9e3ff; color: #2a2d57; font-weight: 600; }
.hbtn { background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: .85rem; }
.hright { display: flex; gap: 8px; }

/* ---------- views ---------- */
.view { display: none; }
.view.on { display: block; }
#map-wrap { position: relative; height: calc(100vh - 64px); min-height: 520px; }
#map { width: 100%; height: 100%; touch-action: none; user-select: none; display: block; }
#map.dragging { cursor: grabbing; }
.ring { transition: transform .9s cubic-bezier(.3,.7,.2,1); }
.ring.nodelay, .ring.nodelay .upright { transition: none; }
.upright { transition: transform .9s cubic-bezier(.3,.7,.2,1); }
.dept-g { transition: opacity .5s; }
.branch { stroke: rgba(255,255,255,.55); stroke-width: 1.3; fill: none; }
.star { fill: #fff; opacity: .85; }
.agent-node { stroke-width: 2; fill: var(--bg1); transition: fill .4s; }
.agent-hit { fill: transparent; cursor: pointer; }
.agent-g.done .agent-node { fill: var(--c); filter: url(#glow); }
.agent-g.error .agent-node { stroke: var(--err); }
.agent-g.running .agent-node { animation: pulse 1s ease-in-out infinite; fill: var(--c); filter: url(#glow); }
.agent-g.running .branch { stroke: var(--c); stroke-dasharray: 6 6; animation: flow .8s linear infinite; }
.agent-g:hover .agent-node { stroke-width: 3; }
.hub { fill: rgba(30,32,70,.85); stroke-width: 1.6; cursor: pointer; }
.hub-letter { font-family: 'Cinzel', serif; font-size: 15px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.dlabel { font-family: 'Cinzel', serif; font-size: 25px; letter-spacing: .16em; fill: var(--ink); text-anchor: middle; cursor: pointer; }
.dsub { font-size: 11px; fill: var(--muted); text-anchor: middle; letter-spacing: .06em; pointer-events: none; }
.bgstar { fill: #fff; animation: twinkle 4s ease-in-out infinite; }
.core-dots { animation: spin 90s linear infinite; }
.core-dot { fill: #fff; }
.core-title { font-family: 'Cinzel', serif; font-size: 17px; letter-spacing: .35em; fill: #fff; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(30,30,70,.8); stroke-width: 4px; }
#core { cursor: pointer; }
@keyframes pulse { 50% { r: 10; } }
@keyframes flow { to { stroke-dashoffset: -12; } }
@keyframes twinkle { 50% { opacity: .15; } }
@keyframes spin { to { transform: rotate(360deg); } }

.map-ctrl {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px; font-size: .75rem; letter-spacing: .14em; color: var(--muted);
}
.map-ctrl button { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; }
.map-hint { position: absolute; left: 16px; top: 12px; font-size: .78rem; color: var(--muted); max-width: 260px; }
#tip {
  position: fixed; pointer-events: none; background: rgba(15,16,40,.92); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; font-size: .8rem; display: none; z-index: 30; max-width: 240px;
}

/* ---------- departments view ---------- */
#depts { padding: 18px 16px 40px; max-width: 1200px; margin: 0 auto; }
.carousel { display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.slot { flex: 1; max-width: 230px; text-align: center; cursor: pointer; opacity: .45; transition: opacity .3s; }
.slot.mid { opacity: 1; max-width: 300px; }
.slot svg { width: 100%; height: auto; display: block; }
.slot .nm { font-family: 'Cinzel', serif; letter-spacing: .14em; font-size: .8rem; padding-bottom: 4px; }
.slot.mid .nm { font-size: 1rem; border-bottom: 1px solid var(--accent); display: inline-block; }
.car-ctrl { display: flex; justify-content: center; gap: 14px; margin: 10px 0 18px; }
.car-ctrl button { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; }
.dhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.dhead h2 { font-family: 'Cinzel', serif; letter-spacing: .12em; font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { background: rgba(20,22,50,.55); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.card h3 { font-size: .98rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.card p { font-size: .82rem; color: var(--muted); }
.card .prev { color: var(--ink); opacity: .85; margin-top: 8px; white-space: pre-wrap; max-height: 5.4em; overflow: hidden; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1.5px solid var(--c, #fff); flex: none; }
.dot.done { background: var(--c); }
.dot.running { background: var(--c); animation: twinkle 1s infinite; }
.dot.error { border-color: var(--err); background: var(--err); }

/* ---------- dashboard ---------- */
#dash { padding: 18px 16px 40px; max-width: 1100px; margin: 0 auto; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: rgba(20,22,50,.55); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.kpi b { display: block; font-size: 1.6rem; font-weight: 600; }
.kpi span { font-size: .78rem; color: var(--muted); letter-spacing: .06em; }
.bars .bar { display: grid; grid-template-columns: 120px 1fr 52px; gap: 10px; align-items: center; margin: 8px 0; font-size: .85rem; }
.track { height: 8px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; border-radius: 99px; background: var(--c); transition: width .5s; }
.log { font-size: .82rem; }
.log div { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.log .t { color: var(--muted); }
h2.sec { font-family: 'Cinzel', serif; letter-spacing: .12em; font-size: 1rem; margin: 22px 0 8px; }

/* ---------- panel ---------- */
#panel {
  position: fixed; top: 0; right: 0; height: 100%; width: min(460px, 100%);
  background: var(--panel); border-left: 1px solid var(--line); z-index: 20;
  transform: translateX(105%); transition: transform .35s; overflow-y: auto; padding: 18px 18px 40px;
  box-shadow: -10px 0 40px rgba(0,0,0,.35);
}
#panel.open { transform: none; }
#panel h2 { font-family: 'Cinzel', serif; letter-spacing: .08em; font-size: 1.3rem; margin: 6px 0; }
.p-top { display: flex; justify-content: space-between; align-items: center; }
.x { background: none; border: 0; font-size: 1.5rem; color: var(--muted); }
.pill { display: inline-block; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--c, var(--accent)); color: var(--c, var(--accent)); border-radius: 99px; padding: 2px 10px; }
.muted { color: var(--muted); font-size: .86rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; align-items: center; }
.btn { background: #e9e3ff; color: #23264a; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.small { padding: 5px 10px; font-size: .8rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.status { font-size: .84rem; color: var(--muted); min-height: 1.2em; }
.status.err { color: var(--err); }
.status.ok { color: var(--ok); }
#out { min-height: 320px; font-family: ui-monospace, Menlo, monospace; font-size: .82rem; line-height: 1.5; margin-top: 8px; }
.alist button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin: 6px 0; }
.alist button span.s { margin-left: auto; font-size: .75rem; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: .86rem; }
.check input { width: auto; }
#toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: rgba(15,16,40,.95); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-size: .85rem; z-index: 40; display: none; max-width: 90vw; }
@media (max-width: 640px) {
  .brand small { display: none; }
  #map-wrap { height: calc(100vh - 110px); min-height: 440px; }
  .map-hint { display: none; }
  .slot:not(.mid) .nm { font-size: .6rem; }
  .bars .bar { grid-template-columns: 90px 1fr 44px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">JARVIS<small id="tagline">AI agents run your channel</small></div>
  <div class="seg" id="tabs">
    <button data-v="map" class="on">Map</button>
    <button data-v="depts">Departments</button>
    <button data-v="dash">Dashboard</button>
  </div>
  <div class="hright">
    <button class="hbtn" id="briefBtn">Brief</button>
    <button class="hbtn" id="setBtn">Settings</button>
  </div>
</header>

<section class="view on" id="v-map">
  <div id="map-wrap">
    <div class="map-hint">Tap a node to run that agent. Tap a department hub to run the whole team. Tap the core to brief Jarvis. Drag to rotate.</div>
    <svg id="map" viewBox="-640 -600 1280 1200" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="map-ctrl"><button id="rotL" aria-label="Rotate left">‹</button><span id="focusName"></span><button id="rotR" aria-label="Rotate right">›</button></div>
  </div>
</section>

<section class="view" id="v-depts"><div id="depts"></div></section>
<section class="view" id="v-dash"><div id="dash"></div></section>

<aside id="panel"></aside>
<div id="tip"></div>
<div id="toast"></div>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.3.0/+esm";

/* =========================================================
   AGENT ROSTER
   ========================================================= */
const SCRIPT_PARTS = [
  ["script_hook", "Hook", 0.06, "Write the opening narration. A surprising claim, question or scene that makes leaving feel like a loss. End on an open loop the video pays off later."],
  ["script_familiar", "Familiar Behavior", 0.14, "Describe the everyday behavior in vivid second person detail so the viewer thinks: that is me."],
  ["script_psych", "Psychology Behind It", 0.20, "Name the concept and the research behind it. Cite researchers and years where you know them. Explain each study in plain words."],
  ["script_brain", "Why Our Brains Do This", 0.18, "Explain the evolutionary or neurological reason for the behavior, in simple language with one concrete analogy."],
  ["script_cost", "The Real Cost", 0.16, "Show what this behavior costs in time, money, health or relationships. Use numbers and label estimates as estimates."],
  ["script_bigger", "Bigger Picture", 0.14, "Zoom out to culture, technology or society. Connect the behavior to a larger pattern."],
  ["script_closing", "Closing Insight + Engagement Hook", 0.12, "Give one clear takeaway and one practical action. Then ask a specific question for the comments and tease the next video."],
];

const DEPTS = [
  { id: "intel", name: "Intelligence", sub: "trends · rivals · audience", color: "#7cc8ff", effort: "medium", web: true, agents: [
    { id: "intel_trend", name: "Trend Scout", task: "List 8 timely angles on this topic that fit the channel. For each, say why it is timely now and who searches for it.", deps: [] },
    { id: "intel_rivals", name: "Competitor Scan", task: "Describe the most common ways existing YouTube videos cover this topic, their typical titles, and the gaps they leave open.", deps: [] },
    { id: "intel_audience", name: "Audience Profile", task: "Write a viewer profile: age range, situation, what they already believe about the topic, the question they want answered, and 6 phrases they would type into YouTube search.", deps: [] },
    { id: "intel_angle", name: "Angle Decider", task: "Pick the single strongest angle for this video. Give a one sentence promise, the core question, the working title, and 3 reasons it beats the alternatives.", deps: ["intel_trend", "intel_rivals", "intel_audience"] },
  ]},
  { id: "script", name: "Script", sub: "hook · psychology · closing", color: "#ff8fb8", effort: "high", agents:
    SCRIPT_PARTS.map(([id, name, share, task], i) => ({
      id, name, share,
      task: `${task}\nWrite about {words} words of spoken narration. Write for the ear: short sentences, no stage directions, no headings. Continue smoothly from the earlier sections.`,
      deps: ["intel_angle", "intel_audience", ...SCRIPT_PARTS.slice(0, i).map((p) => p[0])],
    })) },
  { id: "seo", name: "SEO", sub: "titles · thumbnails · tags", color: "#ffd479", effort: "medium", agents: [
    { id: "seo_title", name: "Title", task: "Write 3 A/B title variants under 60 characters, each with a different angle (curiosity gap, benefit, contrarian). Show the character count and why each earns the click.", deps: ["dept:script", "intel_audience"] },
    { id: "seo_thumb", name: "Thumbnail", task: "Design 3 A/B thumbnail concepts. For each: overlay text of 4 words or fewer, emotion, composition, and a ready image prompt at 16:9.", deps: ["dept:script", "seo_title"] },
    { id: "seo_ab", name: "A/B Testing", task: "Write a test plan for YouTube Test and Compare: which title and thumbnail pairs to test, the metric to watch (watch time share and CTR), how long to run, and the decision rule.", deps: ["seo_title", "seo_thumb"] },
    { id: "seo_chapters", name: "Chapters", task: "Write YouTube chapters. Estimate timestamps from the script at 150 spoken words per minute. First chapter is 0:00. Short titles. Output one chapter per line.", deps: ["dept:script"] },
    { id: "seo_desc", name: "Description", task: "Write the full YouTube description. First 2 lines carry the main keyword and a hook. Then a summary, the chapters, sources mentioned in the script, and a subscribe line.", deps: ["dept:script", "seo_title", "seo_chapters"] },
    { id: "seo_tags", name: "Hashtags", task: "Give 3 to 5 hashtags for the description and 15 search tags, comma separated.", deps: ["dept:script", "intel_audience"] },
  ]},
  { id: "output", name: "Output", sub: "characters · scenes · 21:9", color: "#a98bff", effort: "medium", agents: [
    { id: "out_chars", name: "Characters", task: "Define every recurring character: name, role, age, face, hair, body, outfit, colors and personality.", deps: ["dept:script"] },
    { id: "out_consistency", name: "Character Consistency", task: "For each character write one fixed consistency block of 40 to 70 words. It gets pasted into every image prompt so the character looks identical in every shot. Add a global style block for palette, line style and lighting.", deps: ["out_chars"] },
    { id: "out_chapters", name: "Chapters with Title", task: "Design an on-screen title card for each chapter: chapter number, title text, and a 21:9 image prompt for the card background.", deps: ["dept:script", "seo_chapters"] },
    { id: "out_scenes", name: "Scene Prompts 21:9", task: "For each chapter write 3 to 5 scenes. Each scene: shot description, the narration line it covers, and an image prompt that includes the full consistency block of each character present plus the style block, ending with --ar 21:9.", deps: ["dept:script", "out_consistency", "out_chapters"] },
    { id: "out_motion", name: "Motion Prompts", task: "For each scene write a 3 to 6 second motion prompt for an image to video model: camera move, character motion, and mood. Keep scene numbers aligned.", deps: ["out_scenes"] },
    { id: "out_voice", name: "Voiceover Direction", task: "Mark up the script for the narrator: pace per section, pauses, words to stress, and tone shifts. Keep the script text intact.", deps: ["dept:script"] },
  ]},
  { id: "dist", name: "Distribution", sub: "shorts · socials · schedule", color: "#7ff0c8", effort: "medium", agents: [
    { id: "dist_shorts", name: "Shorts Cutter", task: "Cut 3 vertical 9:16 Shorts from the script, each under 45 seconds. For each: hook line, narration, on-screen text, and the timestamp of the source moment.", deps: ["dept:script"] },
    { id: "dist_captions", name: "Social Captions", task: "Write promo posts for X, Instagram, TikTok and LinkedIn. Match each platform's style and length.", deps: ["dept:script", "seo_title"] },
    { id: "dist_post", name: "Community Post", task: "Write a YouTube Community tab post that teases the video, plus a 4 option poll.", deps: ["seo_title", "dept:script"] },
    { id: "dist_schedule", name: "Upload Scheduler", task: "Recommend the publish day and time for this audience with reasoning, then a 7 day promotion plan that places the Shorts, posts and community post.", deps: ["intel_audience", "dist_shorts"] },
    { id: "dist_newsletter", name: "Newsletter", task: "Write a short email newsletter that shares the core insight and links to the video.", deps: ["dept:script", "seo_title"] },
  ]},
  { id: "community", name: "Community", sub: "comments · replies · ideas", color: "#ff9f7a", effort: "medium", agents: [
    { id: "com_pinned", name: "Pinned Comment", task: "Write the pinned comment: a question that sparks replies plus one extra fact that did not fit the video.", deps: ["dept:script", "seo_title"] },
    { id: "com_replies", name: "Reply Bank", task: "Predict 15 comments viewers will leave (praise, pushback, questions, personal stories) and write a warm, short reply for each.", deps: ["dept:script"] },
    { id: "com_faq", name: "FAQ Builder", task: "Write 8 likely viewer questions with clear answers drawn from the script.", deps: ["dept:script"] },
    { id: "com_next", name: "Next Video Ideas", task: "Propose 5 follow up videos. For each: working title, the hook, and why viewers of this video will click it.", deps: ["intel_trend", "dept:script"] },
  ]},
  { id: "back", name: "Back Office", sub: "sponsors · calendar · checklist", color: "#e6e1ff", effort: "medium", agents: [
    { id: "bo_sponsor", name: "Sponsor Pitch", task: "Name 5 sponsor categories that fit this audience and write a short pitch email with an integration idea for this video.", deps: ["intel_audience", "dept:script"] },
    { id: "bo_calendar", name: "Content Calendar", task: "Build a 4 week upload calendar: one long video and three Shorts per week, using the next video ideas.", deps: ["intel_trend", "com_next"] },
    { id: "bo_checklist", name: "Production Checklist", task: "Write a step by step production checklist from script lock to publish: voiceover, image generation with the consistency blocks, animation, edit at 21:9, thumbnail, upload fields, and promotion.", deps: ["dept:output", "dept:seo"] },
  ]},
];

const AGENTS = {};
DEPTS.forEach((d) => d.agents.forEach((a) => (AGENTS[a.id] = { ...a, dept: d })));
const ALL_IDS = Object.keys(AGENTS);
const expand = (deps) => deps.flatMap((x) => x.startsWith("dept:") ? DEPTS.find((d) => d.id === x.slice(5)).agents.map((a) => a.id) : [x]);
document.getElementById("tagline").textContent = `${ALL_IDS.length} AI agents run your channel`;

/* =========================================================
   STATE
   ========================================================= */
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const DEFAULT = {
  project: { channel: "", voice: "", topic: "", minutes: 10, audience: "", style: "" },
  results: {}, status: {}, usage: { input: 0, output: 0, cost: 0, runs: 0 }, log: [],
};
let S;
try { S = { ...DEFAULT, ...JSON.parse(store.get("jarvis.map.v1")) }; } catch { S = structuredClone(DEFAULT); }
if (!S.project) S = structuredClone(DEFAULT);
Object.keys(S.status).forEach((k) => { if (S.status[k].s === "running") S.status[k].s = S.results[k] ? "done" : "idle"; });
const settings = {
  key: store.get("jarvis.apiKey") || "",
  model: store.get("jarvis.model") || "claude-opus-5-5",
  web: store.get("jarvis.web") !== "off",
};
let saveTimer;
const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set("jarvis.map.v1", JSON.stringify(S)), 250); };
const statusOf = (id) => (S.status[id] && S.status[id].s) || (S.results[id] ? "done" : "idle");
const PRICE = { "claude-opus-5-5": [4, 20], "claude-sonnet-5-5": [2, 10] };

/* =========================================================
   GEOMETRY
   ========================================================= */
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const N = DEPTS.length, STEP = 360 / N, HUB_R = 175, MAX_R = 440, LABEL_R = 515;
const GEO = DEPTS.map((d, k) => {
  const r = rng(k * 97 + 13);
  const a = -Math.PI / 2 + (k * 2 * Math.PI) / N;
  const hub = [Math.cos(a) * HUB_R, Math.sin(a) * HUB_R];
  const n = d.agents.length, spread = ((2 * Math.PI) / N) * 0.82;
  const branches = d.agents.map((ag, j) => {
    const dir = a + (n > 1 ? (j / (n - 1) - 0.5) * spread : 0);
    // Each branch walks toward its own tip; tips alternate between two radii so nodes never overlap.
    const tipR = (j % 2 ? 0.8 : 1) * MAX_R - r() * 25;
    const tip = [Math.cos(dir) * tipR, Math.sin(dir) * tipR];
    const pts = [hub];
    const segs = 3 + Math.floor(r() * 2);
    for (let s = 1; s < segs; s++) {
      const f = s / segs;
      const bx = hub[0] + (tip[0] - hub[0]) * f, by = hub[1] + (tip[1] - hub[1]) * f;
      const nx = -Math.sin(dir), ny = Math.cos(dir), off = (r() - 0.5) * 34;
      pts.push([bx + nx * off, by + ny * off]);
    }
    pts.push(tip);
    const twigs = [];
    if (r() < 0.65) {
      const from = pts[1 + Math.floor(r() * (pts.length - 2))];
      const tw = [from];
      let [tx, ty] = from;
      const tdir = dir + (r() < 0.5 ? -1 : 1) * (0.5 + r() * 0.6);
      for (let s = 0; s < 1 + Math.floor(r() * 2); s++) {
        tx += Math.cos(tdir + (r() - 0.5) * 0.5) * (22 + r() * 18);
        ty += Math.sin(tdir + (r() - 0.5) * 0.5) * (22 + r() * 18);
        tw.push([tx, ty]);
      }
      twigs.push(tw);
    }
    return { id: ag.id, pts, twigs };
  });
  return { a, hub, label: [Math.cos(a) * LABEL_R, Math.sin(a) * LABEL_R], branches };
});
const poly = (pts) => pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ");

/* =========================================================
   MAP RENDER
   ========================================================= */
const svg = $("map");
let theta = 0;

function deptSvg(k, withLabels) {
  const d = DEPTS[k], g = GEO[k];
  let s = `<g class="dept-g" data-dept="${d.id}" style="--c:${d.color}">`;
  s += `<line x1="${(g.hub[0] * 0.55).toFixed(1)}" y1="${(g.hub[1] * 0.55).toFixed(1)}" x2="${g.hub[0].toFixed(1)}" y2="${g.hub[1].toFixed(1)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 6"/>`;
  g.branches.forEach((b) => {
    s += `<g class="agent-g" data-agent="${b.id}">`;
    s += `<polyline class="branch" points="${poly(b.pts)}"/>`;
    b.twigs.forEach((t) => { s += `<polyline class="branch" style="opacity:.6" points="${poly(t)}"/>`; });
    b.pts.slice(1, -1).forEach((p) => { s += `<circle class="star" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6"/>`; });
    b.twigs.forEach((t) => t.slice(1).forEach((p) => { s += `<circle class="star" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2"/>`; }));
    const tip = b.pts[b.pts.length - 1];
    s += `<circle class="agent-node" cx="${tip[0].toFixed(1)}" cy="${tip[1].toFixed(1)}" r="7" stroke="${d.color}"/>`;
    s += `<circle class="agent-hit" cx="${tip[0].toFixed(1)}" cy="${tip[1].toFixed(1)}" r="15"/>`;
    s += `</g>`;
  });
  s += `<circle class="hub" data-hub="${d.id}" cx="${g.hub[0].toFixed(1)}" cy="${g.hub[1].toFixed(1)}" r="17" stroke="${d.color}"/>`;
  s += `<g transform="translate(${g.hub[0].toFixed(1)},${g.hub[1].toFixed(1)})"><g class="upright"><text class="hub-letter" fill="${d.color}">${d.name[0]}</text></g></g>`;
  if (withLabels) {
    s += `<g transform="translate(${g.label[0].toFixed(1)},${g.label[1].toFixed(1)})"><g class="upright">
      <text class="dlabel" data-hub="${d.id}" y="0">${d.name.toUpperCase()}</text>
      <text class="dsub" y="22">${d.sub}</text></g></g>`;
  }
  return s + `</g>`;
}

function buildMap() {
  const r = rng(7);
  let bg = "";
  for (let i = 0; i < 170; i++) {
    bg += `<circle class="bgstar" cx="${(r() * 1280 - 640).toFixed(0)}" cy="${(r() * 1200 - 600).toFixed(0)}" r="${(0.5 + r() * 1.3).toFixed(1)}" style="animation-delay:${(r() * 4).toFixed(2)}s;opacity:${(0.2 + r() * 0.6).toFixed(2)}"/>`;
  }
  let core = "";
  for (let i = 0; i < 170; i++) {
    const rad = Math.pow(r(), 0.7) * 78, ang = r() * Math.PI * 2;
    core += `<circle class="core-dot" cx="${(Math.cos(ang) * rad).toFixed(1)}" cy="${(Math.sin(ang) * rad).toFixed(1)}" r="${(0.6 + r() * 1.4).toFixed(1)}" opacity="${(0.3 + r() * 0.7).toFixed(2)}"/>`;
  }
  svg.innerHTML = `
    <defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="coreg"><stop offset="0" stop-color="rgba(200,180,255,.35)"/><stop offset="1" stop-color="rgba(200,180,255,0)"/></radialGradient></defs>
    <g>${bg}</g>
    <g class="ring" id="ring">${DEPTS.map((_, k) => deptSvg(k, true)).join("")}</g>
    <g id="core"><circle r="96" fill="url(#coreg)"/><g class="core-dots">${core}</g>
      <circle r="88" fill="none" stroke="rgba(255,255,255,.15)"/><text class="core-title" y="5">JARVIS</text></g>`;
  applyRotation();
  paintStatus();
}

const focusIndex = () => (((Math.round(-theta / STEP)) % N) + N) % N;
function applyRotation() {
  $("ring").style.transform = `rotate(${theta}deg)`;
  svg.querySelectorAll("#ring .upright").forEach((u) => (u.style.transform = `rotate(${-theta}deg)`));
  const f = focusIndex();
  svg.querySelectorAll("#ring .dept-g").forEach((g, k) => (g.style.opacity = k === f ? 1 : 0.72));
  $("focusName").textContent = DEPTS[f].name.toUpperCase();
}
function rotateTo(idx) { theta = -idx * STEP; applyRotation(); renderDepts(); }
$("rotL").onclick = () => rotateTo(focusIndex() - 1);
$("rotR").onclick = () => rotateTo(focusIndex() + 1);

function paintStatus() {
  document.querySelectorAll(".agent-g").forEach((g) => {
    const s = statusOf(g.dataset.agent);
    g.classList.toggle("done", s === "done");
    g.classList.toggle("running", s === "running");
    g.classList.toggle("error", s === "error");
  });
}

/* drag to rotate, tap to open */
let drag = null;
svg.addEventListener("pointerdown", (e) => {
  const rc = svg.getBoundingClientRect();
  drag = { cx: rc.left + rc.width / 2, cy: rc.top + rc.height / 2, x: e.clientX, y: e.clientY, start: theta, moved: false };
  drag.a0 = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx);
});
svg.addEventListener("pointermove", (e) => {
  showTip(e);
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
    drag.moved = true; svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); $("ring").classList.add("nodelay");
  }
  if (drag.moved) {
    const a = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx);
    theta = drag.start + ((a - drag.a0) * 180) / Math.PI;
    applyRotation();
  }
});
svg.addEventListener("pointerup", (e) => {
  if (!drag) return;
  if (drag.moved) {
    $("ring").classList.remove("nodelay"); svg.classList.remove("dragging");
    requestAnimationFrame(() => { theta = Math.round(theta / STEP) * STEP; applyRotation(); renderDepts(); });
  } else {
    const t = e.target;
    const ag = t.closest("[data-agent]"), hub = t.closest("[data-hub]");
    if (ag) openAgent(ag.dataset.agent);
    else if (hub) openDept(hub.dataset.hub);
    else if (t.closest("#core")) openBrief();
  }
  drag = null;
});
svg.addEventListener("pointerleave", () => ($("tip").style.display = "none"));

function showTip(e) {
  const tip = $("tip");
  const ag = e.target.closest && e.target.closest("[data-agent]");
  if (!ag || (drag && drag.moved)) { tip.style.display = "none"; return; }
  const a = AGENTS[ag.dataset.agent];
  tip.innerHTML = `<b>${esc(a.name)}</b><br><span class="muted">${esc(a.dept.name)} · ${statusOf(a.id)}</span>`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 250) + "px";
  tip.style.top = e.clientY + 14 + "px";
}

   ========================================================= */
const SYSTEM = `You are Jarvis, the operating system of a growing faceless YouTube channel. You coordinate a team of specialist agents. Each request asks you to act as one agent and return only that agent's deliverable.
Ground psychological and factual claims in real, named research. When you are not sure of a number, say it is an estimate instead of inventing precision. Write in plain, direct language. Plain text only, with short headings or numbered lists where they help.`;

function brief() {
  const p = S.project;
  return [
    `Channel: ${p.channel || "a growing faceless YouTube channel about everyday psychology"}`,
    `Narration voice: ${p.voice || "clear, warm, curious, second person"}`,
    `Video topic: ${p.topic}`,
    `Target length: ${p.minutes || 10} minutes (about ${(p.minutes || 10) * 150} spoken words)`,
    `Audience: ${p.audience || "general YouTube viewers, 18 to 40"}`,
    `Visual style: ${p.style || "clean 2D animation, cinematic 21:9 frames"}`,
  ].join("\n");
}

function buildPrompt(a) {
  const ctx = expand(a.deps).filter((id) => S.results[id]).map((id) => `### ${AGENTS[id].name} (${AGENTS[id].dept.name})\n${S.results[id]}`).join("\n\n");
  const words = a.share ? Math.round((S.project.minutes || 10) * 150 * a.share) : 0;
  return `${brief()}\n\n${ctx ? "Work already done by other agents:\n\n" + ctx + "\n\n" : ""}You are the ${a.name} agent in the ${a.dept.name} department.\nYour task: ${a.task.replace("{words}", words)}\n\nReturn only your deliverable.`;
}

const streams = new Map();
let stopRequested = false;

class FatalError extends Error {}

async function runAgent(id) {
  if (!settings.key) { openSettings("Add your Anthropic API key to start the agents."); throw new FatalError("No API key"); }
  if (!S.project.topic.trim()) { openBrief("Give Jarvis a video topic first."); throw new FatalError("No topic"); }
  const a = AGENTS[id];
  const client = new Anthropic({ apiKey: settings.key, dangerouslyAllowBrowser: true });
  const model = settings.model;
  const t0 = Date.now();
  S.status[id] = { s: "running" };
  S.results[id] = "";
  paintAll();
  const messages = [{ role: "user", content: buildPrompt(a) }];
  const params = {
    model, max_tokens: 16000, system: SYSTEM, messages,
    thinking: { type: "adaptive" },
    output_config: { effort: a.dept.effort },
    betas: ["server-side-fallback-2026-07-01"],
    fallbacks: "default",
  };
  if (a.dept.web && settings.web) params.tools = [{ type: "web_search_20260209", name: "web_search", max_uses: 4 }];
  try {
    let text = "";
    for (let turn = 0; turn < 4; turn++) {
      const stream = client.beta.messages.stream(params);
      streams.set(id, stream);
      stream.on("text", (t) => { text += t; S.results[id] = text; liveUpdate(id); });
      const msg = await stream.finalMessage();
      const [pi, po] = PRICE[model] || PRICE["claude-opus-5-5"];
      S.usage.input += msg.usage.input_tokens; S.usage.output += msg.usage.output_tokens;
      S.usage.cost += (msg.usage.input_tokens * pi + msg.usage.output_tokens * po) / 1e6;
      S.usage.runs += 1;
      if (msg.stop_reason === "refusal") throw new Error("The model declined this task. Rephrase the topic and run it again.");
      if (msg.stop_reason === "pause_turn") { messages.push({ role: "assistant", content: msg.content }); continue; }
      if (msg.stop_reason === "max_tokens") text += "\n\n[Stopped at the length limit.]";
      break;
    }
    S.results[id] = text.trim();
    S.status[id] = { s: "done", t: Date.now() };
    logRun(id, "done", Date.now() - t0);
  } catch (err) {
    let msg = err.message || String(err);
    let fatal = false;
    if (err instanceof Anthropic.AuthenticationError) { msg = "The API key was rejected. Check it in Settings."; fatal = true; }
    else if (err instanceof Anthropic.PermissionDeniedError) { msg = "This key has no access to that model or tool. Try turning off web search in Settings."; }
    else if (err instanceof Anthropic.RateLimitError) msg = "Rate limit reached. Wait a minute and run again.";
    else if (err instanceof Anthropic.APIConnectionError) msg = "Network error. Check your connection.";
    else if (err instanceof Anthropic.APIUserAbortError || stopRequested) msg = "Stopped.";
    S.status[id] = { s: "error", err: msg, t: Date.now() };
    logRun(id, "error", Date.now() - t0, msg);
    if (fatal) throw new FatalError(msg);
  } finally {
    streams.delete(id);
    save(); paintAll();
  }
}

async function runMany(ids) {
  stopRequested = false;
  const pending = new Set(ids), running = new Set();
  toast(`Running ${ids.length} agent${ids.length > 1 ? "s" : ""}...`);
  await new Promise((resolve) => {
    const tick = () => {
      if (stopRequested) pending.clear();
      if (!pending.size && !running.size) return resolve();
      let ready = [...pending].filter((id) => expand(AGENTS[id].deps).every((d) => !pending.has(d) && !running.has(d)));
      if (!ready.length && !running.size) ready = [...pending];
      while (running.size < 3 && ready.length) {
        const id = ready.shift();
        pending.delete(id); running.add(id);
        runAgent(id).catch((e) => { if (e instanceof FatalError) { pending.clear(); toast(e.message); } })
          .finally(() => { running.delete(id); tick(); });
      }
    };
    tick();
  });
  if (!stopRequested) toast("Jarvis finished the run.");
}
function stopAll() { stopRequested = true; streams.forEach((s) => s.abort()); }

function logRun(id, s, ms, err) {
  S.log.unshift({ id, s, ms, err, t: Date.now() });
  S.log = S.log.slice(0, 60);
}

function miniSvg(k) {
  const g = GEO[k];
  const rot = -90 - (g.a * 180) / Math.PI;
  return `<svg viewBox="-210 -300 420 330"><g transform="rotate(${rot.toFixed(1)}) translate(${(-g.hub[0]).toFixed(1)},${(-g.hub[1]).toFixed(1)})">${deptSvg(k, false)}</g></svg>`;
}
function renderDepts() {
  const f = focusIndex();
  const narrow = innerWidth < 640;
  const offs = narrow ? [-1, 0, 1] : [-2, -1, 0, 1, 2];
  const slots = offs.map((o) => {
    const k = (((f + o) % N) + N) % N;
    return `<div class="slot ${o === 0 ? "mid" : ""}" data-k="${k}">${miniSvg(k)}<div class="nm">${DEPTS[k].name.toUpperCase()}</div></div>`;
  }).join("");
  const d = DEPTS[f];
  const done = d.agents.filter((a) => statusOf(a.id) === "done").length;
  $("depts").innerHTML = `
    <div class="carousel">${slots}</div>
    <div class="car-ctrl"><button id="cL" aria-label="Previous">‹</button><button id="cR" aria-label="Next">›</button></div>
    <div class="dhead" style="--c:${d.color}">
      <div><h2>${d.name.toUpperCase()}</h2><p class="muted">${d.sub} · ${done} of ${d.agents.length} done</p></div>
      <div class="row" style="margin:0"><button class="btn" id="cRun">Run department</button><button class="btn ghost" id="cStop">Stop</button></div>
    </div>
    <div class="cards">${d.agents.map((a) => `
      <div class="card" style="--c:${d.color}">
        <h3><i class="dot ${statusOf(a.id)}"></i>${esc(a.name)}</h3>
        <p>${esc(a.task.split("\n")[0])}</p>
        ${S.results[a.id] ? `<p class="prev">${esc(S.results[a.id].slice(0, 260))}</p>` : ""}
        <div class="row" style="margin-bottom:0"><button class="btn small" data-run="${a.id}">Run</button><button class="btn ghost small" data-open="${a.id}">Open</button></div>
      </div>`).join("")}</div>`;
  $("depts").querySelectorAll(".slot").forEach((s) => (s.onclick = () => rotateTo(+s.dataset.k)));
  $("cL").onclick = () => rotateTo(f - 1);
  $("cR").onclick = () => rotateTo(f + 1);
  $("cRun").onclick = () => runMany(d.agents.map((a) => a.id));
  $("cStop").onclick = stopAll;
  $("depts").querySelectorAll("[data-run]").forEach((b) => (b.onclick = () => runMany([b.dataset.run])));
  $("depts").querySelectorAll("[data-open]").forEach((b) => (b.onclick = () => openAgent(b.dataset.open)));
}

/* =========================================================
   DASHBOARD
   ========================================================= */
const wc = (t) => (t || "").split(/\s+/).filter(Boolean).length;
function renderDash() {
  const done = ALL_IDS.filter((id) => statusOf(id) === "done").length;
  const running = ALL_IDS.filter((id) => statusOf(id) === "running").length;
  const words = ALL_IDS.reduce((n, id) => n + wc(S.results[id]), 0);
  const scriptWords = DEPTS[1].agents.reduce((n, a) => n + wc(S.results[a.id]), 0);
  const u = S.usage;
  $("dash").innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${done}/${ALL_IDS.length}</b><span>AGENTS COMPLETE</span></div>
      <div class="kpi"><b>${running}</b><span>RUNNING NOW</span></div>
      <div class="kpi"><b>${(scriptWords / 150).toFixed(1)} min</b><span>SCRIPT LENGTH (${scriptWords.toLocaleString()} WORDS)</span></div>
      <div class="kpi"><b>${words.toLocaleString()}</b><span>WORDS PRODUCED</span></div>
      <div class="kpi"><b>${((u.input + u.output) / 1000).toFixed(1)}k</b><span>TOKENS (${u.runs} CALLS)</span></div>
      <div class="kpi"><b>$${u.cost.toFixed(2)}</b><span>ESTIMATED SPEND</span></div>
    </div>
    <div class="card">
      <h2 class="sec" style="margin-top:0">Progress</h2>
      <div class="bars">${DEPTS.map((d) => {
        const n = d.agents.filter((a) => statusOf(a.id) === "done").length, pct = Math.round((n / d.agents.length) * 100);
        return `<div class="bar" style="--c:${d.color}"><span>${d.name}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="muted">${n}/${d.agents.length}</span></div>`;
      }).join("")}</div>
    </div>
    <h2 class="sec">Activity</h2>
    <div class="card log">${S.log.length ? S.log.slice(0, 25).map((l) => `
      <div><span class="t">${new Date(l.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
      <span>${esc(AGENTS[l.id] ? AGENTS[l.id].name : l.id)} <span class="muted">${l.err ? "· " + esc(l.err) : ""}</span></span>
      <span class="${l.s === "done" ? "status ok" : "status err"}">${l.s} ${(l.ms / 1000).toFixed(0)}s</span></div>`).join("") : `<p class="muted">No runs yet. Brief Jarvis and run the agents.</p>`}</div>
    <div class="row"><button class="btn ghost" id="dExport">Download all outputs</button><button class="btn ghost" id="dReset">Reset spend counter</button></div>`;
  $("dExport").onclick = exportMd;
  $("dReset").onclick = () => { S.usage = { input: 0, output: 0, cost: 0, runs: 0 }; save(); renderDash(); };
}

/* =========================================================
   SHARED
   ========================================================= */
let view = "map";
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => {
  view = b.dataset.v;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === "v-" + view));
  if (view === "depts") renderDepts();
  if (view === "dash") renderDash();
}));

let raf = 0;
function paintAll() {
  paintStatus();
  refreshAgentPanel(); refreshDeptPanel();
  if (view === "depts") renderDepts();
  if (view === "dash") renderDash();
}
function liveUpdate(id) {
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; if (panelFor && panelFor.id === id) refreshAgentPanel(); });
}

let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = "none"), 3200); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied."); } catch { toast("Copy failed. Select the text and copy it."); } }

function exportMd() {
  const parts = [`# ${S.project.topic || "Jarvis run"}\n\n${brief()}`];
  DEPTS.forEach((d) => {
    const rows = d.agents.filter((a) => S.results[a.id]);
    if (!rows.length) return;
    parts.push(`## ${d.name}`);
    rows.forEach((a) => parts.push(`### ${a.name}\n\n${S.results[a.id]}`));
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([parts.join("\n\n")], { type: "text/markdown" }));
  a.download = (S.project.topic || "jarvis").slice(0, 50).replace(/[^\w]+/g, "-").toLowerCase() + ".md";
  a.click();
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
addEventListener("resize", () => { if (view === "depts") renderDepts(); });
buildMap();
if (!settings.key) setTimeout(() => toast("Open Settings and add your API key, then tap the Jarvis core to brief it."), 600);
</script>
</body>
</html>
