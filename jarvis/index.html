<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Channel Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #2a2d57; --bg2: #3d4378; --ink: #f2f0ff; --muted: #a9acd6;
  --line: rgba(255,255,255,.14); --panel: #23264a; --field: #1b1d3b; --accent: #c9b8ff;
  --ok: #8ff0c0; --warn: #ffd479; --alert: #ff8f8f; --skip: #8d90b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Space Grotesk', system-ui, sans-serif; color: var(--ink); background: radial-gradient(ellipse at 50% 40%, var(--bg2), var(--bg1) 70%) fixed, var(--bg1); overflow-x: hidden; }
button { font: inherit; cursor: pointer; color: inherit; }
header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(120,90,200,.25), rgba(120,90,200,.05)); }
.brand { font-family: 'Cinzel', serif; font-size: 1.25rem; letter-spacing: .3em; }
.brand small { display: block; font-family: 'Space Grotesk'; letter-spacing: .03em; font-size: .72rem; color: var(--muted); }
.seg { display: flex; background: rgba(0,0,0,.25); border-radius: 8px; padding: 3px; }
.seg button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.seg button.on { background: #e9e3ff; color: #2a2d57; font-weight: 600; }
.hright { display: flex; gap: 8px; flex-wrap: wrap; }
.hbtn { background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: .85rem; }
.hbtn.main { background: #e9e3ff; color: #23264a; font-weight: 600; border-color: #e9e3ff; }
.view { display: none; } .view.on { display: block; }
#map-wrap { position: relative; height: calc(100vh - 64px); min-height: 520px; }
#map { width: 100%; height: 100%; touch-action: none; user-select: none; display: block; }
.ring, .upright { transition: transform .9s cubic-bezier(.3,.7,.2,1); }
.ring.nodelay, .ring.nodelay .upright { transition: none; }
.branch { stroke: rgba(255,255,255,.5); stroke-width: 1.3; fill: none; }
.star { fill: #fff; opacity: .8; }
.item { stroke-width: 2; cursor: pointer; }
.item.empty { fill: none; stroke: rgba(255,255,255,.35); cursor: default; }
.item-hit { fill: transparent; cursor: pointer; }
.hub { fill: rgba(30,32,70,.9); stroke-width: 2.4; cursor: pointer; }
.hub-letter { font-family: 'Cinzel', serif; font-size: 15px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.dlabel { font-family: 'Cinzel', serif; font-size: 25px; letter-spacing: .16em; fill: var(--ink); text-anchor: middle; cursor: pointer; }
.dsub { font-size: 12px; fill: var(--muted); text-anchor: middle; letter-spacing: .06em; pointer-events: none; }
.bgstar { fill: #fff; animation: twinkle 4s ease-in-out infinite; }
.core-dots { animation: spin 90s linear infinite; }
.core-title { font-family: 'Cinzel', serif; font-size: 17px; letter-spacing: .35em; fill: #fff; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(30,30,70,.8); stroke-width: 4px; }
#core { cursor: pointer; }
.alertpulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-opacity: .25; } }
@keyframes twinkle { 50% { opacity: .15; } }
@keyframes spin { to { transform: rotate(360deg); } }
.map-ctrl { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; font-size: .75rem; letter-spacing: .14em; color: var(--muted); }
.map-ctrl button { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; }
.legend { position: absolute; left: 16px; top: 12px; font-size: .76rem; color: var(--muted); line-height: 1.8; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
#empty { position: absolute; left: 50%; top: 50%; transform: translate(-50%, 120px); text-align: center; width: min(420px, 92vw); background: rgba(27,29,59,.88); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
#empty p { color: var(--muted); font-size: .9rem; margin: 8px 0 14px; }
#tip { position: fixed; pointer-events: none; background: rgba(15,16,40,.94); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .8rem; display: none; z-index: 30; max-width: 260px; }
.wrap { padding: 18px 16px 40px; max-width: 1150px; margin: 0 auto; }
.carousel { display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.slot { flex: 1; max-width: 230px; text-align: center; cursor: pointer; opacity: .45; transition: opacity .3s; }
.slot.mid { opacity: 1; max-width: 300px; }
.slot svg { width: 100%; height: auto; display: block; }
.slot .nm { font-family: 'Cinzel', serif; letter-spacing: .12em; font-size: .78rem; padding-bottom: 4px; }
.slot.mid .nm { font-size: 1rem; border-bottom: 1px solid var(--accent); display: inline-block; }
.car-ctrl { display: flex; justify-content: center; gap: 14px; margin: 10px 0 18px; }
.car-ctrl button { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; }
.card { background: rgba(20,22,50,.55); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
h2.sec { font-family: 'Cinzel', serif; letter-spacing: .12em; font-size: 1rem; margin: 6px 0 10px; }
.pill { display: inline-block; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--c, var(--accent)); color: var(--c, var(--accent)); border-radius: 99px; padding: 2px 10px; margin-right: 6px; }
.muted { color: var(--muted); font-size: .86rem; }
.item-row { display: grid; grid-template-columns: 12px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.item-row:last-child { border-bottom: 0; }
.item-row b { font-weight: 600; }
.item-row .d { color: var(--muted); font-size: .85rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--c); }
pre { white-space: pre-wrap; word-break: break-word; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: ui-monospace, Menlo, monospace; font-size: .82rem; margin-top: 6px; }
.btn { background: #e9e3ff; color: #23264a; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.small { padding: 4px 10px; font-size: .8rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; align-items: center; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
.kpi { background: rgba(20,22,50,.55); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.kpi b { display: block; font-size: 1.5rem; font-weight: 600; }
.kpi span { font-size: .74rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; }
td { padding: 8px; border-top: 1px solid var(--line); vertical-align: top; }
td a { color: var(--ink); }
.score { display: inline-block; min-width: 34px; text-align: center; border-radius: 6px; padding: 1px 6px; font-weight: 600; font-size: .8rem; color: #1b1d3b; }
.tbl { overflow-x: auto; }
#panel { position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 20; transform: translateX(105%); transition: transform .35s; overflow-y: auto; padding: 18px 18px 40px; box-shadow: -10px 0 40px rgba(0,0,0,.35); }
#panel.open { transform: none; }
#panel h2 { font-family: 'Cinzel', serif; letter-spacing: .08em; font-size: 1.3rem; margin: 8px 0 4px; }
#panel h3 { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 4px; font-weight: 500; }
.p-top { display: flex; justify-content: space-between; align-items: center; }
.x { background: none; border: 0; font-size: 1.5rem; color: var(--muted); }
.banner { background: rgba(255,212,121,.14); border: 1px solid rgba(255,212,121,.4); color: var(--warn); border-radius: 8px; padding: 6px 12px; font-size: .8rem; }
#toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: rgba(15,16,40,.95); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-size: .85rem; z-index: 40; display: none; max-width: 90vw; }
#drop { position: fixed; inset: 0; background: rgba(20,20,50,.85); border: 3px dashed var(--accent); z-index: 50; display: none; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 1.4rem; letter-spacing: .14em; }
@media (max-width: 640px) {
  .brand small { display: none; }
  #map-wrap { height: calc(100vh - 150px); min-height: 440px; }
  .legend { display: none; }
  #empty { transform: translate(-50%, 90px); }
}
</style>

</section>
<section class="view" id="v-agents"><div class="wrap" id="agents"></div></section>
<section class="view" id="v-dash"><div class="wrap" id="dash"></div></section>

<aside id="panel"></aside>

<script>
/* =========================================================
   AGENTS (the channel-level skills from youtube-agent-skill)
   ========================================================= */
const AGENTS = [
  { id: "audit", skill: "yt-audit", name: "Channel Audit", sub: "the one fix", color: "#7cc8ff" },
  { id: "package", skill: "yt-package", name: "Packaging", sub: "titles · thumbnails", color: "#ffb86b" },
  { id: "seo", skill: "yt-seo", name: "Search", sub: "queries · description", color: "#ffd479" },
  { id: "viral", skill: "yt-viral", name: "Niche Outliers", sub: "what works now", color: "#ff8fb8" },
  { id: "plan", skill: "yt-plan", name: "Weekly Plan", sub: "anchor · shorts", color: "#7ff0c8" },
  { id: "retention", skill: "yt-retention", name: "Retention", sub: "where viewers leave", color: "#a98bff" },
  { id: "comment", skill: "yt-comment", name: "Comments", sub: "triage · replies", color: "#e6e1ff" },
];
const STATUS_COLOR = { ok: "var(--ok)", warn: "var(--warn)", alert: "var(--alert)", skipped: "var(--skip)" };
const PRIO_COLOR = { high: "#ff8f8f", medium: "#ffd479", low: "#8ff0c0" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };

let R = null;            // the loaded report
const agentData = (id) => (R && R.agents.find((a) => a.id === id)) || null;

/* =========================================================
   LOADING
   ========================================================= */
function validate(r) {
  if (!r || r.schema !== "jarvis-report/1") return "This file is not a Jarvis report (schema must be jarvis-report/1).";
  if (!Array.isArray(r.agents) || !r.channel || !r.headline) return "The report is missing channel, headline or agents.";
  return null;
}
function useReport(r, remember) {
  const err = validate(r);
  if (err) { toast(err); return; }
  r.videos = r.videos || [];
  R = r;
  if (remember) store.set("jarvis.report", JSON.stringify(r));
  buildMap();
  renderAll();
  toast(r.sample ? "Showing the sample report with made-up data." : `Loaded report for ${r.channel.name}.`);
}
function readFile(f) {
  const fr = new FileReader();
  fr.onload = () => { try { useReport(JSON.parse(fr.result), true); } catch { toast("That file is not valid JSON."); } };
  fr.readAsText(f);
}
const pick = () => $("file").click();
$("loadBtn").onclick = pick;
$("emptyLoad").onclick = pick;
$("emptySample").onclick = () => useReport(JSON.parse($("sample").textContent), false);
$("file").onchange = (e) => { if (e.target.files[0]) readFile(e.target.files[0]); e.target.value = ""; };
let dragDepth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; $("drop").style.display = "flex"; });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").style.display = "none"; } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; $("drop").style.display = "none"; const f = e.dataTransfer.files[0]; if (f) readFile(f); });

/* =========================================================
   MAP GEOMETRY
   ========================================================= */
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const N = AGENTS.length, STEP = 360 / N, HUB_R = 175, MAX_R = 440, LABEL_R = 515;

// Items on an agent's constellation: findings, recommendations, things working.
function itemsFor(id) {
  const a = agentData(id);
  if (!a) return [];
  return [
    ...a.findings.map((f, i) => ({ kind: "finding", i, color: PRIO_COLOR[f.priority] || "#fff", label: f.title, sub: `${f.priority} priority finding` })),
    ...a.recommendations.map((r, i) => ({ kind: "rec", i, color: "#e9e3ff", label: r.action, sub: `recommendation · ${r.effort} effort` })),
    ...(a.working || []).map((w, i) => ({ kind: "working", i, color: "#8ff0c0", label: w, sub: "working, keep it" })),
  ].slice(0, 9);
}

function geometry(k) {
  const r = rng(k * 97 + 13);
  const a = -Math.PI / 2 + (k * 2 * Math.PI) / N;
  const hub = [Math.cos(a) * HUB_R, Math.sin(a) * HUB_R];
  const items = itemsFor(AGENTS[k].id);
  const n = Math.max(items.length, 4);
  const spread = ((2 * Math.PI) / N) * 0.8;
  const branches = [];
  for (let j = 0; j < n; j++) {
    const dir = a + (n > 1 ? (j / (n - 1) - 0.5) * spread : 0);
    const tipR = (j % 2 ? 0.8 : 1) * MAX_R - r() * 25;
    const tip = [Math.cos(dir) * tipR, Math.sin(dir) * tipR];
    const pts = [hub];
    const segs = 3 + Math.floor(r() * 2);
    for (let s = 1; s < segs; s++) {
      const f = s / segs, nx = -Math.sin(dir), ny = Math.cos(dir), off = (r() - 0.5) * 34;
      pts.push([hub[0] + (tip[0] - hub[0]) * f + nx * off, hub[1] + (tip[1] - hub[1]) * f + ny * off]);
    }
    pts.push(tip);
    const twigs = [];
    if (r() < 0.55) {
      const from = pts[1 + Math.floor(r() * (pts.length - 2))];
      const tdir = dir + (r() < 0.5 ? -1 : 1) * (0.6 + r() * 0.5);
      const len = 24 + r() * 18;
      twigs.push([from, [from[0] + Math.cos(tdir) * len, from[1] + Math.sin(tdir) * len]]);
    }
    branches.push({ pts, twigs, item: items[j] || null });
  }
  return { a, hub, label: [Math.cos(a) * LABEL_R, Math.sin(a) * LABEL_R], branches };
}
const poly = (pts) => pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ");

function agentSvg(k, g, withLabels) {
  const ag = AGENTS[k], d = agentData(ag.id);
  const st = d ? d.status : null;
  let s = `<g class="agent-g" data-agent="${ag.id}" style="opacity:${st === "skipped" ? 0.5 : 1}">`;
  s += `<line x1="${(g.hub[0] * 0.55).toFixed(1)}" y1="${(g.hub[1] * 0.55).toFixed(1)}" x2="${g.hub[0].toFixed(1)}" y2="${g.hub[1].toFixed(1)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 6"/>`;
  g.branches.forEach((b, j) => {
    s += `<polyline class="branch" points="${poly(b.pts)}"${b.item ? "" : ' style="opacity:.45"'}/>`;
    b.twigs.forEach((t) => (s += `<polyline class="branch" style="opacity:.5" points="${poly(t)}"/>`));
    b.pts.slice(1, -1).forEach((p) => (s += `<circle class="star" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5"/>`));
    b.twigs.forEach((t) => (s += `<circle class="star" cx="${t[1][0].toFixed(1)}" cy="${t[1][1].toFixed(1)}" r="2"/>`));
    const tip = b.pts[b.pts.length - 1];
    if (b.item) {
      s += `<g data-item="${ag.id}:${b.item.kind}:${b.item.i}"><circle class="item" cx="${tip[0].toFixed(1)}" cy="${tip[1].toFixed(1)}" r="${b.item.kind === "rec" ? 8 : 7}" fill="${b.item.color}" stroke="${ag.color}" filter="url(#glow)"/>`;
      s += `<circle class="item-hit" cx="${tip[0].toFixed(1)}" cy="${tip[1].toFixed(1)}" r="15"/></g>`;
    } else {
      s += `<circle class="item empty" cx="${tip[0].toFixed(1)}" cy="${tip[1].toFixed(1)}" r="6"/>`;
    }
  });
  const ring = st ? STATUS_COLOR[st] : ag.color;
  s += `<circle class="hub${st === "alert" ? " alertpulse" : ""}" data-hub="${ag.id}" cx="${g.hub[0].toFixed(1)}" cy="${g.hub[1].toFixed(1)}" r="18" stroke="${ring}"/>`;
  s += `<g transform="translate(${g.hub[0].toFixed(1)},${g.hub[1].toFixed(1)})"><g class="upright"><text class="hub-letter" fill="${ag.color}">${ag.name[0]}</text></g></g>`;
  if (withLabels) {
    const sub = d ? (d.score != null ? `score ${d.score} · ${st}` : st) : ag.sub;
    s += `<g transform="translate(${g.label[0].toFixed(1)},${g.label[1].toFixed(1)})"><g class="upright">
      <text class="dlabel" data-hub="${ag.id}">${ag.name.toUpperCase()}</text>
      <text class="dsub" y="22">/${ag.skill} · ${esc(sub)}</text></g></g>`;
  }
  return s + "</g>";
}

/* =========================================================
   MAP RENDER
   ========================================================= */
const svg = $("map");
let theta = 0, GEO = [];
function buildMap() {
  GEO = AGENTS.map((_, k) => geometry(k));
  const r = rng(7);
  let bg = "", core = "";
  for (let i = 0; i < 170; i++) bg += `<circle class="bgstar" cx="${(r() * 1280 - 640).toFixed(0)}" cy="${(r() * 1200 - 600).toFixed(0)}" r="${(0.5 + r() * 1.3).toFixed(1)}" style="animation-delay:${(r() * 4).toFixed(2)}s;opacity:${(0.2 + r() * 0.6).toFixed(2)}"/>`;
  for (let i = 0; i < 170; i++) { const rad = Math.pow(r(), 0.7) * 78, ang = r() * Math.PI * 2; core += `<circle fill="#fff" cx="${(Math.cos(ang) * rad).toFixed(1)}" cy="${(Math.sin(ang) * rad).toFixed(1)}" r="${(0.6 + r() * 1.4).toFixed(1)}" opacity="${(0.3 + r() * 0.7).toFixed(2)}"/>`; }
  svg.innerHTML = `
    <defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="coreg"><stop offset="0" stop-color="rgba(200,180,255,.35)"/><stop offset="1" stop-color="rgba(200,180,255,0)"/></radialGradient></defs>
    <g>${bg}</g>
    <g class="ring" id="ring">${AGENTS.map((_, k) => agentSvg(k, GEO[k], true)).join("")}</g>
    <g id="core"><circle r="96" fill="url(#coreg)"/><g class="core-dots">${core}</g>
      <circle r="88" fill="none" stroke="${R && R.agents.some((a) => a.status === "alert") ? "rgba(255,143,143,.6)" : "rgba(255,255,255,.15)"}"/><text class="core-title" y="5">JARVIS</text></g>`;
  $("empty").style.display = R ? "none" : "block";
  applyRotation();
}
const focusIndex = () => (((Math.round(-theta / STEP)) % N) + N) % N;
function applyRotation() {
  $("ring").style.transform = `rotate(${theta}deg)`;
  svg.querySelectorAll("#ring .upright").forEach((u) => (u.style.transform = `rotate(${-theta}deg)`));
  $("focusName").textContent = AGENTS[focusIndex()].name.toUpperCase();
}
function rotateTo(i) { theta = -i * STEP; applyRotation(); if (view === "agents") renderAgents(); }
$("rotL").onclick = () => rotateTo(focusIndex() - 1);
$("rotR").onclick = () => rotateTo(focusIndex() + 1);

let drag = null;
svg.addEventListener("pointerdown", (e) => {
  const rc = svg.getBoundingClientRect();
  drag = { cx: rc.left + rc.width / 2, cy: rc.top + rc.height / 2, x: e.clientX, y: e.clientY, start: theta, moved: false };
  drag.a0 = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx);
});
svg.addEventListener("pointermove", (e) => {
  showTip(e);
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) { drag.moved = true; svg.setPointerCapture(e.pointerId); $("ring").classList.add("nodelay"); }
  if (drag.moved) { theta = drag.start + ((Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx) - drag.a0) * 180) / Math.PI; applyRotation(); }
});
svg.addEventListener("pointerup", (e) => {
  if (!drag) return;
  if (drag.moved) {
    $("ring").classList.remove("nodelay");
    requestAnimationFrame(() => { theta = Math.round(theta / STEP) * STEP; applyRotation(); });
  } else {
    const it = e.target.closest("[data-item]"), hub = e.target.closest("[data-hub]");
    if (it) { const [id, kind, i] = it.dataset.item.split(":"); openAgent(id, `${kind}-${i}`); }
    else if (hub) openAgent(hub.dataset.hub);
    else if (e.target.closest("#core")) openCore();
  }
  drag = null;
});
svg.addEventListener("pointerleave", () => ($("tip").style.display = "none"));
function showTip(e) {
  const tip = $("tip"), it = e.target.closest && e.target.closest("[data-item]");
  if (!it || (drag && drag.moved)) { tip.style.display = "none"; return; }
  const [id, kind, i] = it.dataset.item.split(":");
  const item = itemsFor(id).find((x) => x.kind === kind && String(x.i) === i);
  if (!item) return;
  tip.innerHTML = `<b>${esc(item.label)}</b><br><span class="muted">${esc(item.sub)}</span>`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + "px";
  tip.style.top = e.clientY + 14 + "px";
}

/* =========================================================
   PANEL
   ========================================================= */
const panel = $("panel");
const closePanel = () => panel.classList.remove("open");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });

function agentDetail(id) {
  const ag = AGENTS.find((a) => a.id === id), d = agentData(id);
  if (!d) return `<p class="muted">This agent is not in the loaded report.</p>`;
  const list = (arr, fn) => arr && arr.length ? arr.map(fn).join("") : "";
  return `
    <p><span class="pill" style="--c:${STATUS_COLOR[d.status]}">${esc(d.status)}</span>${d.score != null ? `<span class="pill">score ${d.score}</span>` : ""}<span class="pill" style="--c:${ag.color}">/${esc(d.skill)}</span></p>
    <p style="margin-top:10px">${esc(d.summary)}</p>
    ${d.findings.length ? `<h3>Findings</h3>${list(d.findings, (f, i) => `<div class="item-row" id="finding-${i}"><i class="dot" style="--c:${PRIO_COLOR[f.priority]}"></i><div><b>${esc(f.title)}</b><div class="d">${esc(f.detail)}${f.evidence ? `<br>Evidence: ${esc(f.evidence)}` : ""}</div></div></div>`)}` : ""}
    ${d.recommendations.length ? `<h3>Recommendations</h3>${list(d.recommendations, (r, i) => `<div class="item-row" id="rec-${i}"><i class="dot" style="--c:#e9e3ff"></i><div><b>${esc(r.action)}</b><div class="d">${esc(r.why)} · ${esc(r.effort)} effort</div></div></div>`)}` : ""}
    ${d.working && d.working.length ? `<h3>Working, keep it</h3>${list(d.working, (w, i) => `<div class="item-row" id="working-${i}"><i class="dot" style="--c:#8ff0c0"></i><div>${esc(w)}</div></div>`)}` : ""}
    ${d.not_yet && d.not_yet.length ? `<h3>Not yet</h3>${list(d.not_yet, (w) => `<div class="item-row"><i class="dot" style="--c:var(--skip)"></i><div>${esc(w)}</div></div>`)}` : ""}
    ${d.copy_block ? `<h3>Copy block</h3><pre>${esc(d.copy_block)}</pre><button class="btn ghost small" data-copy="${esc(d.copy_block)}" style="margin-top:6px">Copy</button>` : ""}
    ${d.missing_inputs.length ? `<h3>Missing inputs</h3>${list(d.missing_inputs, (m) => `<div class="item-row"><i class="dot" style="--c:var(--warn)"></i><div class="d">${esc(m)}</div></div>`)}` : ""}`;
}
function openAgent(id, anchor) {
  const ag = AGENTS.find((a) => a.id === id);
  panel.innerHTML = `<div class="p-top"><span class="pill" style="--c:${ag.color}">Agent</span><button class="x" id="px">×</button></div>
    <h2>${esc(ag.name)}</h2>${R ? agentDetail(id) : `<p class="muted">Load a report to see what this agent found.</p>`}`;
  $("px").onclick = closePanel;
  panel.classList.add("open");
  panel.scrollTop = 0;
  if (anchor) { const el = document.getElementById(anchor); if (el) { el.scrollIntoView({ block: "center" }); el.style.background = "rgba(255,255,255,.06)"; } }
}
function openCore() {
  if (!R) { openHelp(); return; }
  const h = R.headline;
  panel.innerHTML = `<div class="p-top"><span class="pill">Jarvis</span><button class="x" id="px">×</button></div>
    <h2>The one fix</h2>
    ${R.sample ? `<p class="banner">Sample report with made-up data</p>` : ""}
    <p style="margin-top:10px;font-size:1.05rem"><b>${esc(h.one_fix)}</b></p>
    <h3>Why</h3><p>${esc(h.why)}</p>
    <h3>This week</h3><p>${esc(h.this_week)}</p>
    <h3>Agents</h3>${AGENTS.map((a) => { const d = agentData(a.id); return `<div class="item-row"><i class="dot" style="--c:${d ? STATUS_COLOR[d.status] : "var(--skip)"}"></i><div><b>${esc(a.name)}</b><div class="d">${esc(d ? d.summary : "not in this report")}</div></div></div>`; }).join("")}`;
  $("px").onclick = closePanel;
  panel.classList.add("open");
}
function openHelp() {
  panel.innerHTML = `<div class="p-top"><span class="pill">Help</span><button class="x" id="px">×</button></div>
    <h2>How Jarvis works</h2>
    <p class="muted">Claude Code runs your YouTube skills on your laptop. This page only shows the report. It has no API key and sends nothing anywhere.</p>
    <h3>Run a report</h3>
    <div class="item-row"><i class="dot" style="--c:var(--accent)"></i><div>Open a terminal in your <b>jarvis-reports</b> folder and start <b>claude</b>.</div></div>
    <div class="item-row"><i class="dot" style="--c:var(--accent)"></i><div>Type <b>/jarvis-report</b> and wait for it to finish.</div></div>
    <div class="item-row"><i class="dot" style="--c:var(--accent)"></i><div>Click <b>Load report</b> here and choose <b>reports/latest.json</b>. You can also drag the file onto the page.</div></div>
    <h3>Privacy</h3>
    <p class="muted">The report stays in this browser. Jarvis remembers the last report on this device until you click Forget.</p>
    <div class="row"><button class="btn ghost" id="hSample">View sample</button><button class="btn ghost" id="hForget">Forget report</button></div>
    <h3>Other pages</h3>
    <div class="row"><a class="btn ghost" style="text-decoration:none" href="agents.html">35 agent map (API key)</a><a class="btn ghost" style="text-decoration:none" href="../">Back to site</a></div>`;
  $("px").onclick = closePanel;
  $("hSample").onclick = () => { closePanel(); useReport(JSON.parse($("sample").textContent), false); };
  $("hForget").onclick = () => { store.set("jarvis.report", null); R = null; buildMap(); renderAll(); closePanel(); toast("Report removed from this browser."); };
  panel.classList.add("open");
}
$("moreBtn").onclick = openHelp;
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); toast("Copied."); } catch { toast("Copy failed. Select the text and copy it."); }
});

/* =========================================================
   AGENTS VIEW (carousel)
   ========================================================= */
function miniSvg(k) {
  const g = GEO[k], rot = -90 - (g.a * 180) / Math.PI;
  return `<svg viewBox="-210 -300 420 330"><g transform="rotate(${rot.toFixed(1)}) translate(${(-g.hub[0]).toFixed(1)},${(-g.hub[1]).toFixed(1)})">${agentSvg(k, g, false)}</g></svg>`;
}
function renderAgents() {
  const f = focusIndex(), offs = innerWidth < 640 ? [-1, 0, 1] : [-2, -1, 0, 1, 2];
  const slots = offs.map((o) => { const k = (((f + o) % N) + N) % N; return `<div class="slot ${o === 0 ? "mid" : ""}" data-k="${k}">${miniSvg(k)}<div class="nm">${AGENTS[k].name.toUpperCase()}</div></div>`; }).join("");
  const ag = AGENTS[f];
  $("agents").innerHTML = `
    <div class="carousel">${slots}</div>
    <div class="car-ctrl"><button id="cL" aria-label="Previous">‹</button><button id="cR" aria-label="Next">›</button></div>
    <div class="card"><h2 class="sec">${esc(ag.name.toUpperCase())}</h2>${R ? agentDetail(ag.id) : `<p class="muted">Load a report to see what /${ag.skill} found.</p>`}</div>`;
  $("agents").querySelectorAll(".slot").forEach((s) => (s.onclick = () => rotateTo(+s.dataset.k)));
  $("cL").onclick = () => rotateTo(f - 1);
  $("cR").onclick = () => rotateTo(f + 1);
}

/* =========================================================
   DASHBOARD
   ========================================================= */
const scoreColor = (v) => v == null ? "var(--skip)" : v >= 72 ? "var(--ok)" : v >= 55 ? "var(--warn)" : "var(--alert)";
const fmtDur = (s) => s == null ? "" : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function renderDash() {
  if (!R) { $("dash").innerHTML = `<div class="card"><p class="muted">Load a report to see the dashboard.</p><div class="row"><button class="btn" onclick="document.getElementById('file').click()">Load report</button></div></div>`; return; }
  const c = R.channel, counts = { alert: 0, warn: 0, ok: 0, skipped: 0 };
  R.agents.forEach((a) => (counts[a.status] = (counts[a.status] || 0) + 1));
  const recs = R.agents.flatMap((a) => a.recommendations.map((r) => ({ ...r, agent: a.name })));
  const order = { low: 0, medium: 1, high: 2 };
  recs.sort((x, y) => order[x.effort] - order[y.effort]);
  const missing = R.agents.flatMap((a) => a.missing_inputs.map((m) => ({ m, agent: a.name })));
  const ts = R.videos.map((v) => v.title_score).filter((v) => v != null);
  const hs = R.videos.map((v) => v.hook_score).filter((v) => v != null);
  const avg = (arr) => arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null;
  $("dash").innerHTML = `
    ${R.sample ? `<p class="banner" style="margin-bottom:12px">Sample report with made-up data. Load your own report to see your channel.</p>` : ""}
    <div class="card"><h2 class="sec">The one fix</h2><p style="font-size:1.05rem"><b>${esc(R.headline.one_fix)}</b></p><p class="muted" style="margin-top:6px">${esc(R.headline.this_week)}</p></div>
    <div class="kpis">
      <div class="kpi"><b>${c.subscribers != null ? c.subscribers.toLocaleString() : "n/a"}</b><span>Subscribers</span></div>
      <div class="kpi"><b>${c.videos_analyzed}</b><span>Videos analyzed</span></div>
      <div class="kpi"><b style="color:${scoreColor(avg(ts))}">${avg(ts) ?? "n/a"}</b><span>Avg title score</span></div>
      <div class="kpi"><b style="color:${scoreColor(avg(hs))}">${avg(hs) ?? "n/a"}</b><span>Avg hook score</span></div>
      <div class="kpi"><b style="color:var(--alert)">${counts.alert}</b><span>Agents on alert</span></div>
      <div class="kpi"><b>${new Date(R.generated_at).toLocaleDateString()}</b><span>Report date</span></div>
    </div>
    <div class="grid2">
      <div class="card"><h2 class="sec">Agents</h2>${AGENTS.map((a) => { const d = agentData(a.id); return `<div class="item-row" style="cursor:pointer" data-open="${a.id}"><i class="dot" style="--c:${d ? STATUS_COLOR[d.status] : "var(--skip)"}"></i><div><b>${esc(a.name)}</b> <span class="muted">${d ? esc(d.status) + (d.score != null ? " · " + d.score : "") : "missing"}</span><div class="d">${esc(d ? d.summary : "")}</div></div></div>`; }).join("")}</div>
      <div class="card"><h2 class="sec">Do these, easiest first</h2>${recs.length ? recs.map((r) => `<div class="item-row"><i class="dot" style="--c:#e9e3ff"></i><div><b>${esc(r.action)}</b><div class="d">${esc(r.agent)} · ${esc(r.effort)} effort · ${esc(r.why)}</div></div></div>`).join("") : `<p class="muted">No recommendations.</p>`}</div>
    </div>
    ${R.videos.length ? `<div class="card"><h2 class="sec">Videos</h2><div class="tbl"><table>
      <tr><th>Video</th><th>Published</th><th>Views</th><th>Length</th><th>Title</th><th>Hook</th></tr>
      ${R.videos.map((v) => `<tr><td><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>${v.title_issues && v.title_issues.length ? `<div class="muted">${esc(v.title_issues.join(", "))}</div>` : ""}</td><td>${esc(v.published || "")}</td><td>${v.views != null ? v.views.toLocaleString() : ""}</td><td>${fmtDur(v.duration)}</td>
        <td><span class="score" style="background:${scoreColor(v.title_score)}">${v.title_score ?? "–"}</span></td><td><span class="score" style="background:${scoreColor(v.hook_score)}">${v.hook_score ?? "–"}</span></td></tr>`).join("")}
    </table></div></div>` : ""}
    ${missing.length ? `<div class="card"><h2 class="sec">Add these for a better report</h2>${missing.map((x) => `<div class="item-row"><i class="dot" style="--c:var(--warn)"></i><div><b>${esc(x.agent)}</b><div class="d">${esc(x.m)}</div></div></div>`).join("")}</div>` : ""}`;
  $("dash").querySelectorAll("[data-open]").forEach((el) => (el.onclick = () => openAgent(el.dataset.open)));
}

/* =========================================================
   SHARED
   ========================================================= */
let view = "map";
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => {
  view = b.dataset.v;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("on", v.id === "v-" + view));
  renderAll();
}));
function renderAll() {
  $("tagline").textContent = R ? `${R.channel.name} · ${R.agents.length} agents · ${new Date(R.generated_at).toLocaleDateString()}` : "No report loaded";
  if (view === "agents") renderAgents();
  if (view === "dash") renderDash();
}
let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = "none"), 3500); }
addEventListener("resize", () => { if (view === "agents") renderAgents(); });

try { const saved = JSON.parse(store.get("jarvis.report")); if (saved && !validate(saved)) R = saved; } catch {}
buildMap();
renderAll();
</script>
</body>
