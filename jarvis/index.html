#core { cursor: pointer; }
.alertpulse { animation: pulse 1.6s ease-in-out infinite; }

.wrap { padding: 18px 16px 40px; max-width: 1150px; margin: 0 auto; }

.car-ctrl { display: flex; justify-content: center; gap: 14px; margin: 10px 0 18px; }

.card { background: rgba(20,22,50,.55); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }

.muted { color: var(--muted); font-size: .86rem; }

table { width: 100%; border-collapse: collapse; font-size: .85rem; }

/* =========================================================
   LOADING
   ========================================================= */
function validate(r) {
  if (!r || r.schema !== "jarvis-report/1") return "This file is not a Jarvis report (schema must be jarvis-report/1).";
  if (!Array.isArray(r.agents) || !r.channel || !r.headline) return "The report is missing channel, headline or agents.";
  return null;
}
function useReport(r, remember, fromFolder) {
  const err = validate(r);
  if (err) { toast(err); return; }
  r.videos = r.videos || [];
  R = r;
  if (!fromFolder) { HIST = []; }
  if (remember) store.set("jarvis.report", JSON.stringify(r));
  buildMap();
  renderAll();
  if (!fromFolder) toast(r.sample ? "Showing the sample report with made-up data." : `Loaded report for ${r.channel.name}.`);
}
function readFile(f) {
  const fr = new FileReader();
  fr.onload = () => { try { useReport(JSON.parse(fr.result), true); } catch { toast("That file is not valid JSON."); } };
  fr.readAsText(f);
}

/* ---------- reports folder (Edge and Chrome) ---------- */
let HIST = [];             // [{ date, report }] newest first, from the connected folder
let DIR = null;            // the connected folder handle
const canFolder = "showDirectoryPicker" in window;
function idb() {
  return new Promise((res, rej) => {
    const q = indexedDB.open("jarvis", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("kv");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function idbGet(k) {
  try { const db = await idb(); return await new Promise((r) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); } catch { return null; }
}
async function idbSet(k, v) {
  try { const db = await idb(); await new Promise((r) => { const t = db.transaction("kv", "readwrite"); const s = t.objectStore("kv"); v === null ? s.delete(k) : s.put(v, k); t.oncomplete = r; t.onerror = r; }); } catch {}
}
async function loadFolder(dir, quiet) {
  const found = [];
  for await (const [name, h] of dir.entries()) {
    if (h.kind !== "file" || !/^\d{4}-\d{2}-\d{2}\.json$/.test(name)) continue;
    try {
      const r = JSON.parse(await (await h.getFile()).text());
      if (!validate(r) && !r.sample) found.push({ date: name.slice(0, 10), report: r });
    } catch {}
  }
  if (!found.length) {
    try { return await loadFolder(await dir.getDirectoryHandle("reports"), quiet); } catch {}
    toast("No reports found there. Choose the reports folder inside jarvis-reports.");
    return null;
  }
  found.sort((a, b) => b.date.localeCompare(a.date));
  HIST = found;
  DIR = dir;
  useReport(found[0].report, false, true);
  setFolderBtn("Refresh");
  if (!quiet) toast(`Loaded ${found.length} report${found.length > 1 ? "s" : ""}. Newest: ${found[0].date}.`);
  return dir;
}

const GH = "https://api.github.com/repos/Sentinel134/jarvis-reports/contents/reports";
async function loadGitHub(quiet) {
  const tok = store.get("jarvis.ghToken");
  if (!tok) return false;
  const get = async (url, raw) => {
    const res = await fetch(url, { cache: "no-store", headers: { Authorization: `Bearer ${tok}`, Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json" } });
    if (res.status === 401 || res.status === 403 || res.status === 404) throw new Error("auth");
    if (!res.ok) throw new Error("net");
    return res.json();
  };
  try {
    const names = (await get(GH)).map((f) => f.name).filter((n) => /^\d{4}-\d{2}-\d{2}\.json$/.test(n));
    const found = [];
    const reps = await Promise.all(names.map((n) => get(`${GH}/${n}`, true).catch(() => null)));
    names.forEach((n, i) => { const r = reps[i]; if (r && !validate(r) && !r.sample) found.push({ date: n.slice(0, 10), report: r }); });
    if (!found.length) { if (!quiet) toast("No reports in jarvis-reports/reports yet."); return true; }
    found.sort((a, b) => b.date.localeCompare(a.date));
    HIST = found;
    useReport(found[0].report, true, true);
    setFolderBtn("Refresh");
    if (!quiet) toast(`Loaded ${found.length} report${found.length > 1 ? "s" : ""} from GitHub. Newest: ${found[0].date}.`);
    return true;
  } catch (e) {
    if (e.message === "auth") { store.set("jarvis.ghToken", null); toast("GitHub refused the token. Connect GitHub again in Help."); }
    else toast("Could not reach GitHub. Showing the last saved report.");
    return true;
  }
}

/* =========================================================
   MAP GEOMETRY
   ========================================================= */
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const N = AGENTS.length, STEP = 360 / N, HUB_R = 175, MAX_R = 440, LABEL_R = 515;

// Items on an agent's constellation: findings, recommendations, things working.
function itemsFor(id) {
  const a = agentData(id);
  if (!a) return [];
  return [
    ...a.findings.map((f, i) => ({ kind: "finding", i, color: PRIO_COLOR[f.priority] || "#fff", label: f.title, sub: `${f.priority} priority finding` })),
    ...a.recommendations.map((r, i) => ({ kind: "rec", i, color: "#e9e3ff", label: r.action, sub: `recommendation · ${r.effort} effort` })),
    ...(a.working || []).map((w, i) => ({ kind: "working", i, color: "#8ff0c0", label: w, sub: "working, keep it" })),
  ].slice(0, 9);
}

function geometry(k) {
  const r = rng(k * 97 + 13);
  const a = -Math.PI / 2 + (k * 2 * Math.PI) / N;
  const hub = [Math.cos(a) * HUB_R, Math.sin(a) * HUB_R];
  const items = itemsFor(AGENTS[k].id);
  const n = Math.max(items.length, 4);
  const spread = ((2 * Math.PI) / N) * 0.8;
  const branches = [];
  for (let j = 0; j < n; j++) {
    const dir = a + (n > 1 ? (j / (n - 1) - 0.5) * spread : 0);
    const tipR = (j % 2 ? 0.8 : 1) * MAX_R - r() * 25;
    const tip = [Math.cos(dir) * tipR, Math.sin(dir) * tipR];
    const pts = [hub];
    const segs = 3 + Math.floor(r() * 2);
    for (let s = 1; s < segs; s++) {
      const f = s / segs, nx = -Math.sin(dir), ny = Math.cos(dir), off = (r() - 0.5) * 34;
      pts.push([hub[0] + (tip[0] - hub[0]) * f + nx * off, hub[1] + (tip[1] - hub[1]) * f + ny * off]);
    }
    pts.push(tip);
    const twigs = [];
    if (r() < 0.55) {
      const from = pts[1 + Math.floor(r() * (pts.length - 2))];
      const tdir = dir + (r() < 0.5 ? -1 : 1) * (0.6 + r() * 0.5);
      const len = 24 + r() * 18;
      twigs.push([from, [from[0] + Math.cos(tdir) * len, from[1] + Math.sin(tdir) * len]]);
    }
    branches.push({ pts, twigs, item: items[j] || null });
  }
  return { a, hub, label: [Math.cos(a) * LABEL_R, Math.sin(a) * LABEL_R], branches };
}
/* =========================================================
   LIVE ENGINE (canvas). One set of spring nodes drives two views:
   the Map (whole constellation around the brain core) and the
   Agents carousel (one agent large in the middle, neighbors at the sides).
   ========================================================= */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
let theta = 0, GEO = [];                    // map rotation in degrees
let NODES = [], LINKS = [], HUBS = [], BRANCHES = [], STARS = [], BRIGHT = [], GALAXY = [], CORE = [], CORE_PAIRS = [], PULSES = [], METEORS = [];
let nextMeteor = 4, nextPulse = 0;
let spin = REDUCED ? 0 : 3.2;               // degrees per second: one turn in about 2 minutes
let spinVel = 0, target = null;
let hover = null, hoverCore = false, grab = null, last = performance.now(), clock = 0;
let CAR = 0;                                // carousel position, eases toward the focused agent

const STAT_RGB = { ok: "143,240,192", warn: "255,212,121", alert: "255,143,143", skipped: "141,144,184" };
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
const isSkipped = (k) => { const d = agentData(AGENTS[k].id); return !!(d && d.status === "skipped"); };

/* ---------- the two drawing surfaces ---------- */
function surface(id) { const cv = $(id); return { cv, g: cv.getContext("2d"), W: 0, H: 0, DPR: 1 }; }
const MAP = surface("map"), CAR_S = surface("acv");
let W = 0, H = 0, SCALE = 1;                // map size, kept as globals for the background layers

function fit(S) {
  const rc = S.cv.getBoundingClientRect();
  S.DPR = Math.min(2, devicePixelRatio || 1);
  S.W = rc.width; S.H = rc.height;
  S.cv.width = Math.round(S.W * S.DPR); S.cv.height = Math.round(S.H * S.DPR);
  if (S === MAP) { W = S.W; H = S.H; SCALE = Math.min(W / 1280, (H - (W < 640 ? 230 : 150)) / 1200); }   // room for the floating controls
}
function resize() { if (MAP.cv.clientWidth) fit(MAP); if (CAR_S.cv.clientWidth) fit(CAR_S); }
addEventListener("resize", resize);

/* ---------- transforms: screen = origin + scale * rotate(world - pivot) ---------- */
const T = (ox, oy, s, ang, hx = 0, hy = 0, alpha = 1) => ({ ox, oy, s, c: Math.cos(ang), sn: Math.sin(ang), hx, hy, alpha });
const toS = (t, x, y) => { const dx = x - t.hx, dy = y - t.hy; return [t.ox + t.s * (dx * t.c - dy * t.sn), t.oy + t.s * (dx * t.sn + dy * t.c)]; };
const toW = (t, px, py) => { const dx = (px - t.ox) / t.s, dy = (py - t.oy) / t.s; return [t.hx + dx * t.c + dy * t.sn, t.hy - dx * t.sn + dy * t.c]; };
const rad = () => (theta * Math.PI) / 180;
const mapT = () => T(W / 2, H / 2, SCALE, rad());
const wrapN = (v) => ((v % N) + N * 1.5) % N - N / 2;      // signed distance around the ring, in agents

// Agents view: where agent k sits in the carousel right now (null when off stage).
function slotT(k) {
  const S = CAR_S, o = wrapN(k - CAR), ao = Math.abs(o);
  const narrow = S.W < 640;
  if (ao > (narrow ? 1.6 : 2.6)) return null;
  const base = Math.min((S.H * 0.8 - 40) / 300, (S.W * (narrow ? 0.86 : 0.38)) / 440);
  const s = base * (ao <= 1 ? 1 - 0.45 * ao : 0.55 - 0.18 * (ao - 1));
  const x = S.W / 2 + o * S.W * (narrow ? 0.4 : 0.235);
  const alpha = ao <= 1 ? 1 - 0.42 * ao : Math.max(0, 0.58 - 0.4 * (ao - 1));
  const h = HUBS[k];
  return T(x, S.H * 0.8, s, -Math.PI / 2 - GEO[k].a, h.rx, h.ry, alpha);
}

/* ---------- build ---------- */
function buildMap() {
  GEO = AGENTS.map((_, k) => geometry(k));
  NODES = []; LINKS = []; HUBS = []; BRANCHES = [];
  const r = rng(11);
  const add = (x, y, o) => { const n = { rx: x, ry: y, x, y, vx: 0, vy: 0, ph: r() * Math.PI * 2, amp: o.amp ?? 3 + r() * 4, ...o }; NODES.push(n); return n; };
  GEO.forEach((g, k) => {
    const ag = AGENTS[k], d = agentData(ag.id);
    const hub = add(g.hub[0], g.hub[1], { kind: "hub", agent: ag, k, r: 17, amp: 2.5, status: d ? d.status : null, label: g.label });
    HUBS.push(hub);
    g.branches.forEach((b) => {
      let prev = hub;
      const chain = [hub];
      b.pts.slice(1).forEach((p, i, arr) => {
        const tip = i === arr.length - 1;
        const n = add(p[0], p[1], tip
          ? { kind: b.item ? "item" : "empty", agent: ag, k, item: b.item, r: b.item ? (b.item.kind === "rec" ? 8 : 7) : 5.5 }
          : { kind: "star", agent: ag, k, r: 2.6 });
        LINKS.push({ a: prev, b: n, k, len: Math.hypot(n.rx - prev.rx, n.ry - prev.ry), dim: !b.item });
        chain.push(n);
        prev = n;
      });
      b.twigs.forEach((t) => {
        const from = chain.reduce((best, n) => (Math.hypot(n.rx - t[0][0], n.ry - t[0][1]) < Math.hypot(best.rx - t[0][0], best.ry - t[0][1]) ? n : best), chain[1] || hub);
        const n = add(t[1][0], t[1][1], { kind: "star", agent: ag, k, r: 2, twig: true });
        LINKS.push({ a: from, b: n, k, len: Math.hypot(n.rx - from.rx, n.ry - from.ry), dim: true });
      });
      BRANCHES.push({ hub, chain, k, live: !!b.item });
    });
  });
  const TINTS = ["255,255,255", "255,255,255", "205,220,255", "180,200,255", "255,236,214", "232,210,255"];
  STARS = Array.from({ length: 650 }, () => ({ x: r() * 2000 - 1000, y: r() * 1900 - 950, s: 0.35 + Math.pow(r(), 3) * 1.6, z: 0.2 + r() * 0.8, tw: r() * 6, tws: 0.6 + r() * 2, c: TINTS[Math.floor(r() * TINTS.length)] }));
  BRIGHT = Array.from({ length: 16 }, () => ({ x: r() * 1900 - 950, y: r() * 1800 - 900, s: 1.4 + r() * 1.4, z: 0.5 + r() * 0.5, tw: r() * 6, c: TINTS[Math.floor(r() * TINTS.length)] }));
  const ARM_RGB = ["170,140,255", "120,160,255", "235,140,210", "200,190,255"];
  GALAXY = Array.from({ length: 1300 }, (_, i) => {
    const arm = i % 3, t = Math.pow(r(), 0.7), radius = 110 + t * 620;
    const ang = (arm * 2 * Math.PI) / 3 + radius * 0.0105 + (r() - 0.5) * (0.5 + t * 0.6);
    return { x: Math.cos(ang) * radius, y: Math.sin(ang) * radius * 0.92, s: 0.4 + r() * 1.1, al: (0.05 + r() * 0.22) * (1 - t * 0.55), c: ARM_RGB[Math.floor(r() * ARM_RGB.length)] };
  });
  CORE = [];
  const NC = 240, GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < NC; i++) {
    const y = 1 - (i / (NC - 1)) * 2, rr = Math.sqrt(1 - y * y), a = GA * i, j = 0.86 + r() * 0.2;
    CORE.push({ x: Math.cos(a) * rr * j, y: y * j, z: Math.sin(a) * rr * j, s: 0.7 + r() * 1.2 });
  }
  CORE_PAIRS = [];
  for (let i = 0; i < NC; i++) for (let j = i + 1; j < NC; j++) {
    const a = CORE[i], b = CORE[j];
    if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2 < 0.055) CORE_PAIRS.push([i, j]);
  }
  PULSES = [];
  $("empty").style.display = R ? "none" : "block";
  resize();
  updateFocus();
}

/* ---------- physics: springs home, links like soft ropes ---------- */
const K_HOME = 26, K_LINK = 140, DAMP = 7.5;
function step(dt) {
  const held = grab && grab.node;
  for (const n of NODES) {
    if (n === held) continue;
    const fx = REDUCED ? 0 : Math.sin(clock * 0.9 + n.ph) * n.amp;
    const fy = REDUCED ? 0 : Math.cos(clock * 0.7 + n.ph * 1.3) * n.amp;
    const k = n.kind === "hub" ? K_HOME * 2.2 : K_HOME;
    n.ax = k * (n.rx + fx - n.x) - DAMP * n.vx;
    n.ay = k * (n.ry + fy - n.y) - DAMP * n.vy;
  }
  for (const l of LINKS) {
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy) || 0.001;
    const f = (K_LINK * (d - l.len)) / d;
    if (l.a !== held) { l.a.ax += f * dx * 0.5; l.a.ay += f * dy * 0.5; }
    if (l.b !== held) { l.b.ax -= f * dx; l.b.ay -= f * dy; }
  }
  for (const n of NODES) {
    if (n === held) continue;
    n.vx += n.ax * dt; n.vy += n.ay * dt;
    n.x += n.vx * dt; n.y += n.vy * dt;
  }
}

/* ---------- signals ---------- */
function spawnPulse() {
  const live = BRANCHES.filter((b) => b.live);
  const pool = live.length ? live : BRANCHES;
  const b = pool[Math.floor(Math.random() * pool.length)];
  if (b) PULSES.push({ b, t: 0, speed: 0.35 + Math.random() * 0.25, rgb: hexRgb(b.hub.agent.color) });
}
function pulsePoint(p) {
  const pts = [[p.b.hub.x * 0.64, p.b.hub.y * 0.64], ...p.b.chain.map((n) => [n.x, n.y])];
  const segs = pts.length - 1, u = Math.min(p.t * segs, segs - 1e-6), i = Math.floor(u), f = u - i;
  return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f, i];
}

/* ---------- drawing: background (map only) ---------- */
function drawBackground(g) {
  const a = rad();
  const SS = Math.max(0.55, Math.min(1.4, Math.min(W, H) / 900));
  const SC = Math.max(SCALE, 0.55);
  for (const s of STARS) {
    const c = Math.cos(a * s.z * 0.35), sn = Math.sin(a * s.z * 0.35);
    const x = W / 2 + (s.x * c - s.y * sn) * SC, y = H / 2 + (s.x * sn + s.y * c) * SC;
    if (x < -4 || y < -4 || x > W + 4 || y > H + 4) continue;
    const tw = REDUCED ? 0.7 : 0.45 + 0.4 * Math.sin(clock * s.tws + s.tw);
    g.fillStyle = `rgba(${s.c},${(tw * (0.35 + s.z * 0.65)).toFixed(3)})`;
    const rr = s.s * (0.5 + s.z * 0.7) * SS;
    if (rr < 0.9) g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    else { g.beginPath(); g.arc(x, y, rr, 0, 6.283); g.fill(); }
  }
  for (const s of BRIGHT) {
    const c = Math.cos(a * s.z * 0.35), sn = Math.sin(a * s.z * 0.35);
    const x = W / 2 + (s.x * c - s.y * sn) * SC, y = H / 2 + (s.x * sn + s.y * c) * SC;
    if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
    const tw = REDUCED ? 0.8 : 0.55 + 0.45 * Math.sin(clock * 0.9 + s.tw);
    const rr = s.s * SS, L = rr * (5 + 4 * tw);
    const glow = g.createRadialGradient(x, y, 0, x, y, rr * 5);

/* ---------- loop: the brain never stops ---------- */
function frame(now) {

    if (Math.abs(diff) < 0.05) { theta = target; target = null; }
  } else if (!(grab && grab.kind === "spin")) {
    theta += (spinVel + (view === "map" ? spin : 0)) * dt;   // the carousel holds still on the agent you picked
    spinVel *= Math.pow(0.12, dt);
  }
  CAR += wrapN(focusIndex() - CAR) * Math.min(1, dt * 6);

    const t = grab.S === MAP ? mapT() : slotT(grab.node.k);
    if (t) { const [wx, wy] = toW(t, grab.px, grab.py); grab.node.x = wx; grab.node.y = wy; grab.node.vx = grab.node.vy = 0; }
  }

    METEORS.push({ x: fromLeft ? Math.random() * W * 0.5 : W * 0.5 + Math.random() * W * 0.5, y: Math.random() * H * 0.45, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, t: 0, life: 0.7 + Math.random() * 0.5 });

let lastFocus = -1;

function pickNode(S, px, py) {
  const tf = S === MAP ? (() => { const t = mapT(); return () => t; })() : slotT;

const LINE = "#8b78f0";
const avgOf = (r, k) => { const v = (r.videos || []).map((x) => x[k]).filter((x) => Number.isInteger(x)); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
function chart(id, title, pts, opts = {}) {
  const W = 560, H = 200, L = 48, RP = 14, T = 12, B = 28;
  const vals = pts.map((p) => p.v).filter((v) => v != null);
  if (!vals.length) return `<div class="card"><h2 class="sec">${title}</h2><p class="muted">No data yet.</p></div>`;
  let lo, hi;
  if (opts.range) [lo, hi] = opts.range;
  else { lo = Math.min(...vals); hi = Math.max(...vals); const pad = (hi - lo) * 0.2 || Math.max(2, Math.abs(hi) * 0.1); lo = Math.max(0, Math.floor(lo - pad)); hi = Math.ceil(hi + pad); }
  const x = (i) => (pts.length === 1 ? (L + W - RP) / 2 : L + (i / (pts.length - 1)) * (W - L - RP));
  const y = (v) => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);
  const ticks = [lo, Math.round((lo + hi) / 2), hi];
  let g = ticks.map((t) => `<line x1="${L}" x2="${W - RP}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.08)"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="14" fill="var(--muted)">${t.toLocaleString()}</text>`).join("");
  if (opts.target != null) g += `<line x1="${L}" x2="${W - RP}" y1="${y(opts.target)}" y2="${y(opts.target)}" stroke="rgba(255,255,255,.3)" stroke-dasharray="4 4"/><text x="${W - RP}" y="${y(opts.target) + 17}" text-anchor="end" font-size="14" fill="var(--muted)">target ${opts.target}</text>`;
  const idx = pts.length > 2 ? [0, Math.floor((pts.length - 1) / 2), pts.length - 1] : pts.map((_, i) => i);
  g += [...new Set(idx)].map((i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="14" fill="var(--muted)">${pts[i].date.slice(5)}</text>`).join("");
  let path = "", open = false;
  pts.forEach((p, i) => { if (p.v == null) { open = false; return; } path += `${open ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)} `; open = true; });
  const dots = pts.map((p, i) => p.v == null ? "" : `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" fill="${LINE}" stroke="#1f2246" stroke-width="2"/>`).join("");
  const last = [...pts].reverse().find((p) => p.v != null);
  return `<div class="card"><h2 class="sec">${title}</h2>
    <p class="muted" style="margin:-4px 0 6px">Latest: <b style="color:var(--ink)">${last.v.toLocaleString()}</b> on ${last.date}</p>
    <svg class="hchart" data-id="${id}" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:pan-y">
      ${g}<path d="${path}" fill="none" stroke="${LINE}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.35)" visibility="hidden"/>
      <rect x="${L}" y="0" width="${W - L - RP}" height="${H}" fill="transparent"/>
    </svg></div>`;
}

let view = "map";
function showView(v, k) {
  view = v;
  document.body.classList.toggle("paged", v !== "map");
  if (view === "agents") rotateTo(k ?? focusIndex());      // settle on one agent
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x.dataset.v === v));
  document.querySelectorAll(".view").forEach((el) => el.classList.toggle("on", el.id === "v-" + view));
  if (view !== "map") scrollTo({ top: 0 });
  renderAll();
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => showView(b.dataset.v)));
const fmtDate = (d) => new Date(d).toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "numeric" });
function renderAll() {
  $("tagline").textContent = R ? fmtDate(R.generated_at) + (R.sample ? " · sample" : "") : "No report loaded";
  $("legendWrap").hidden = view === "hist";
  if (view === "agents") renderAgents();
  if (view === "hist") renderHist();
  if ($("dash") && panel.classList.contains("open")) renderDash();
}
let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = "none"), 3500); }

try { const saved = JSON.parse(store.get("jarvis.report")); if (saved && !validate(saved)) R = saved; } catch {}
buildMap();
renderAll();

// Reopen the connected reports folder. The browser keeps the folder; read access
// returns at once when granted ("Allow on every visit"), or after one click on "Open folder".
(async () => {
  if (await loadGitHub(true)) return;
  if (!canFolder) return;
  setFolderBtn("Connect folder");
  const saved = await idbGet("dir");
  if (!saved) return;
  try {
    if ((await saved.queryPermission({ mode: "read" })) === "granted") await loadFolder(saved, true);
    else setFolderBtn("Open folder");
  } catch { setFolderBtn("Connect folder"); }
})();
</script>
</body>
</html>
