<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Brain Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #070818; --bg2: #141436; --ink: #f2f0ff; --muted: #a9acd6;
  --line: rgba(255,255,255,.14); --panel: #23264a; --field: #1b1d3b; --accent: #c9b8ff;
  --ok: #8ff0c0; --warn: #ffd479; --alert: #ff8f8f; --skip: #8d90b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Space Grotesk', system-ui, sans-serif; color: var(--ink); background: radial-gradient(ellipse at 50% 42%, var(--bg2), var(--bg1) 62%) fixed, var(--bg1); overflow: hidden; }
button { font: inherit; cursor: pointer; color: inherit; }
#map-wrap { position: relative; height: 100vh; height: 100dvh; min-height: 480px; }
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.date { font-family: 'Cinzel', serif; font-size: .95rem; letter-spacing: .12em; color: var(--ink); text-shadow: 0 1px 8px rgba(0,0,0,.6); min-width: 0; }
.icons { display: flex; gap: 8px; }
.ibtn { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(10,10,32,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); color: var(--ink); padding: 0; transition: background .2s, transform .2s; }
.ibtn:hover { background: rgba(201,184,255,.18); transform: translateY(-1px); }
.ibtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ibtn[hidden] { display: none; }
.fab { position: fixed; bottom: 16px; z-index: 15; width: 46px; height: 46px; }
#dashBtn { left: 16px; }
.legend-wrap { position: fixed; right: 16px; bottom: 16px; z-index: 15; }
.legend-wrap .fab { position: static; }
.legend-pop { position: absolute; right: 0; bottom: 56px; width: 240px; background: rgba(16,17,44,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .8rem; color: var(--muted); line-height: 2; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.legend-pop i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.legend-pop i.pulse { background: #fff; box-shadow: 0 0 0 2px var(--accent), 0 0 10px 3px rgba(201,184,255,.9); animation: blink 1.4s ease-in-out infinite; }
.legend-pop i.glow { background: var(--accent); box-shadow: 0 0 8px 2px rgba(201,184,255,.45); }
.legend-pop i.dim { background: rgba(255,255,255,.25); width: 5px; height: 5px; margin: 0 10px 0 2px; }
@keyframes blink { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 3px 1px rgba(201,184,255,.3); } }
#map { width: 100%; height: 100%; touch-action: none; user-select: none; display: block; cursor: grab; }
#map.grabbing { cursor: grabbing; }
.map-ctrl { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; font-size: .75rem; letter-spacing: .14em; color: var(--muted); }
.map-ctrl span { display: inline-block; width: 200px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map-ctrl button { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; }
#empty { position: absolute; left: 50%; top: 50%; transform: translate(-50%, 140px); text-align: center; width: min(440px, 92vw); background: rgba(27,29,59,.88); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; z-index: 5; }
#empty p { color: var(--muted); font-size: .9rem; margin: 8px 0 14px; }
#tip { position: fixed; pointer-events: none; background: rgba(15,16,40,.94); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .8rem; display: none; z-index: 30; max-width: 300px; line-height: 1.35; }
#tip .st { display: inline-block; margin-top: 4px; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; }
.card { background: rgba(20,22,50,.55); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
h2.sec { font-family: 'Cinzel', serif; letter-spacing: .12em; font-size: 1rem; margin: 6px 0 10px; }
.pill { display: inline-block; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--c, var(--accent)); color: var(--c, var(--accent)); border-radius: 99px; padding: 2px 10px; margin-right: 6px; }
.muted { color: var(--muted); font-size: .86rem; }
.item-row { display: grid; grid-template-columns: 12px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.item-row:last-child { border-bottom: 0; }
.item-row b { font-weight: 600; }
.item-row .d { color: var(--muted); font-size: .85rem; }
.item-row[data-item] { cursor: pointer; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--c); }
.dot.pulse { background: #fff; box-shadow: 0 0 0 2px var(--c), 0 0 8px 2px var(--c); }
.btn { background: #e9e3ff; color: #23264a; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; align-items: center; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
.kpi { background: rgba(20,22,50,.55); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.kpi b { display: block; font-size: 1.5rem; font-weight: 600; }
.kpi span { font-size: .74rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
#panel { position: fixed; left: 50%; top: 50%; z-index: 20; width: min(580px, calc(100vw - 32px)); max-height: min(78vh, 760px); overflow-y: auto; padding: 0 20px 24px;
  background: rgba(18,19,48,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(201,184,255,.22); border-radius: 18px;
  box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;
  opacity: 0; pointer-events: none; transform: translate(-50%, -46%) scale(.94); transition: opacity .25s ease, transform .3s cubic-bezier(.2,.9,.3,1.2); }
#panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
#panel.wide { width: min(1120px, calc(100vw - 32px)); max-height: 86vh; }
#panel .p-top { position: sticky; top: 0; z-index: 2; margin: 0 -20px; padding: 14px 20px 10px; background: linear-gradient(rgba(18,19,48,.98) 70%, rgba(18,19,48,0)); }
#panel h2 { font-family: 'Cinzel', serif; letter-spacing: .08em; font-size: 1.3rem; margin: 8px 0 4px; }
#panel h3 { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 4px; font-weight: 500; }
.p-top { display: flex; justify-content: space-between; align-items: center; }
.x { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; font-size: 1.2rem; line-height: 1; color: var(--ink); }
.x:hover { background: rgba(255,143,143,.18); }
.banner { background: rgba(255,212,121,.14); border: 1px solid rgba(255,212,121,.4); color: var(--warn); border-radius: 8px; padding: 6px 12px; font-size: .8rem; }
#toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: rgba(15,16,40,.95); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-size: .85rem; z-index: 40; display: none; max-width: 90vw; }
#drop { position: fixed; inset: 0; background: rgba(20,20,50,.85); border: 3px dashed var(--accent); z-index: 50; display: none; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 1.4rem; letter-spacing: .14em; }
a { color: var(--ink); }
@media (max-width: 640px) {
  .topbar { padding: 10px 12px; }
  .date { font-size: .8rem; }
  .ibtn { width: 36px; height: 36px; }
  .map-ctrl span { width: 150px; }
  #empty { transform: translate(-50%, 90px); }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="date" id="tagline">No brain data loaded</div>
  <div class="icons">
    <button class="ibtn" id="folderBtn" hidden title="Connect brain data folder" aria-label="Connect brain data folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg></button>
    <button class="ibtn" id="loadBtn" title="Load brain.json" aria-label="Load brain.json"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></button>
    <button class="ibtn" id="moreBtn" title="Help" aria-label="Help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></button>
  </div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>
<button class="ibtn fab" id="dashBtn" title="Summary" aria-label="Summary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 15.5h6M9 9h2"/></svg></button>
<div class="legend-wrap" id="legendWrap">
  <div class="legend-pop" id="legendPop" hidden>
    <div><i class="pulse"></i>Fix still needed / not used yet</div>
    <div><i class="glow"></i>Finding, or fix applied / used</div>
    <div><i class="dim"></i>No data on this neuron</div>
  </div>
  <button class="ibtn fab" id="infoBtn" title="Legend" aria-label="Legend" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".7" fill="currentColor"/></svg></button>
</div>

<main id="map-wrap">
  <canvas id="map" aria-label="Brain map: YTAS and JARVIS, with JARVIS's children SHORTS and VIDEOS. Lit neurons are real findings and fixes. Drag to pan, scroll to zoom, hover a lit neuron for details."></canvas>
  <div id="empty">
    <p>The 6:00 AM YTAS run writes <b>my-video\web\data\brain.json</b> on your laptop. Connect that folder once, or load the file. It stays in your browser.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="emptyFolder" hidden>Connect folder</button><button class="btn" id="emptyLoad">Load brain.json</button><button class="btn ghost" id="emptySample">View sample</button></div>
  </div>
  <div class="map-ctrl"><button id="rotL" aria-label="Previous brain">‹</button><span id="focusName"></span><button id="rotR" aria-label="Next brain">›</button></div>
</main>

<aside id="panel"></aside>
<div id="tip"></div>
<div id="toast"></div>
<div id="drop">DROP BRAIN.JSON</div>

<script type="application/json" id="sample">
{"schema":"valora-brain/1","sample":true,"generated_at":"2026-11-10T06:00:00+08:00","channel":{"name":"Sample Channel (demo data)","url":"https://www.youtube.com/"},
"ytas":{"roots":{"yt-script":[{"kind":"finding","state":"glow","text":"Hook scores 41 WEAK (demo).","video_title":"Demo video one","date":"2026-11-09","detail":"Report finding"},{"id":"V-1","kind":"fix","state":"pulse","text":"Open on the viewer's cost in sentence one (demo).","video_title":"Demo video one","date":"2026-11-09","detail":"Fix still needed"}],
"yt-package":[{"kind":"finding","state":"glow","text":"Title runs past 50 characters on mobile (demo).","video_title":"Demo video two","date":"2026-11-08","detail":"Report finding"}],
"yt-edit":[{"kind":"edit","state":"glow","text":"background music","video_title":"Demo video one","date":"2026-11-09","detail":"Used: music bed"},{"kind":"edit","state":"pulse","text":"change the tone","video_title":"Demo video two","date":"2026-11-08","detail":"Recommended: warmer read on the closing line"}],
"yt-comment":[],"yt-plan":[],"yt-shorts":[],"yt-chapters":[],"yt-seo":[{"id":"Y-1","kind":"fix","state":"glow","text":"Put the search phrase in line one (demo).","video_title":"Demo video two","date":"2026-11-08","detail":"Fix applied"}],"yt-retention":[{"kind":"finding","state":"glow","text":"Half of viewers leave at 0:22 (demo).","video_title":"Demo video one","date":"2026-11-09","detail":"Report finding"}],"yt-viral":[],"yt-audit":[]},
"reports":[{"video_id":"demo1","title":"Demo video one","early":true}],"learnings":[{"date":"2026-11-09","video_id":"demo1","fix":"Open on the viewer's cost (demo)","status":"testing"}]},
"jarvis":{"prompts":{"videos":"Long-form script prompt (demo)","shorts":"Shorts script prompt (demo)"},"in_transit":{"videos":["V-1"],"shorts":[]},"rotation":{"short":{"used":["Money Mindset"],"drafted":[],"remaining":["Spending Psychology","Wealth Psychology","Investing Psychology","Behavioral Finance"]},"long":{"used":[],"drafted":[],"remaining":["Spending Psychology","Wealth Psychology","Investing Psychology","Behavioral Finance","Money Mindset"]}},"scripts":1},
"videos":{"parts":{"A":"Opening Hook","B":"The Familiar Behavior","C":"The Psychology Behind It","D":"Why Our Brain Does This","E":"The Real Cost","F":"The Bigger Picture","G":"Closing Insight + Final Engagement Hook"},"roots":{"A":[{"id":"V-1","kind":"fix","state":"pulse","text":"Open on the viewer's cost in sentence one (demo).","video_title":"Demo video one","date":"2026-11-09","detail":"Received, not used in a script yet"}],"B":[],"C":[],"D":[],"E":[],"F":[],"G":[],"all":[]}},
"shorts":{"parts":{"1":"The Hook","2":"The Recognition","3":"The Psychology","4":"The Revelation","5":"The Closing Loop"},"roots":{"1":[],"2":[{"id":"S-1","kind":"fix","state":"glow","text":"Keep the scene in present tense (demo).","video_title":"Demo short","date":"2026-11-07","detail":"Used in jarvis/scripts/demo.md"}],"3":[],"4":[],"5":[],"all":[]}}}
</script>

<script>
/* =========================================================
   THE FOUR BRAINS AND THEIR ROOTS
   ========================================================= */
const YTAS_ROOTS = [
  ["yt-script", "Script", "#7cc8ff"], ["yt-package", "Packaging", "#ffb86b"], ["yt-edit", "Edit", "#ff8fb8"],
  ["yt-comment", "Comments", "#e6e1ff"], ["yt-plan", "Plan", "#7ff0c8"], ["yt-shorts", "Shorts", "#9fe870"],
  ["yt-chapters", "Chapters", "#c9b8ff"], ["yt-seo", "Search", "#ffd479"], ["yt-retention", "Retention", "#a98bff"],
  ["yt-viral", "Niche Outliers", "#ff9f7c"], ["yt-audit", "Audit", "#8fe3ff"],
];
const VIDEO_PARTS = { A: "Opening Hook", B: "The Familiar Behavior", C: "The Psychology Behind It", D: "Why Our Brain Does This", E: "The Real Cost", F: "The Bigger Picture", G: "Closing Insight + Final Engagement Hook" };
const SHORT_PARTS = { 1: "The Hook", 2: "The Recognition", 3: "The Psychology", 4: "The Revelation", 5: "The Closing Loop" };
const VIDEO_RGB = ["#7cc8ff", "#9fb4ff", "#b9a6ff", "#d39bff", "#ff9fd6", "#ffb86b", "#ffd479"];
const SHORT_RGB = ["#7ff0c8", "#9fe870", "#d4f06f", "#ffd479", "#ffb86b"];
// x, y in world units; arc: where the roots fan out (degrees, centre and spread)
const BRAINS = [
  { id: "ytas", name: "YTAS", sub: "the analyst · 11 skills", x: -390, y: 0, R: 108, tint: "150,200,255", arc: [180, 290], len: 290 },
  { id: "jarvis", name: "JARVIS", sub: "the scriptwriter", x: 250, y: 0, R: 108, tint: "210,195,255" },
  { id: "videos", name: "VIDEOS", sub: "long-form · parts A to G", x: 650, y: -280, R: 66, tint: "235,175,255", arc: [-40, 190], len: 205 },
  { id: "shorts", name: "SHORTS", sub: "Shorts · parts 1 to 5", x: 650, y: 280, R: 66, tint: "150,240,210", arc: [40, 160], len: 205 },
];
const FOCUS = [{ name: "ALL BRAINS" }, ...BRAINS];
const STATE_TXT = { pulse: "Fix still needed · not used yet", glow: "Finding · or fix applied / used" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
// The old page kept a GitHub token and report here. This page never uses a token: clear them.
store.set("jarvis.ghToken", null); store.set("jarvis.report", null);

let B = null;  // the loaded brain.json

/* =========================================================
   LOADING (local file or local folder only; nothing is fetched)
   ========================================================= */
function validate(b) {
  if (!b || b.schema !== "valora-brain/1") return "This file is not brain.json (schema must be valora-brain/1).";
  if (!b.ytas || !b.ytas.roots || !b.videos || !b.shorts || !b.jarvis) return "brain.json is missing ytas, jarvis, videos or shorts.";
  return null;
}
function useBrain(b, remember, quiet) {
  const err = validate(b);
  if (err) { toast(err); return false; }
  B = b;
  if (remember) store.set("valora.brain", JSON.stringify(b));
  buildMap();
  renderAll();
  if (!quiet) toast(b.sample ? "Showing the sample brain with made-up data." : `Loaded brain data from ${fmtDate(b.generated_at)}.`);
  return true;
}
function readFile(f) {
  const fr = new FileReader();
  fr.onload = () => { try { useBrain(JSON.parse(fr.result), true); } catch { toast("That file is not valid JSON."); } };
  fr.readAsText(f);
}
let DIR = null;
const canFolder = "showDirectoryPicker" in window;
function idb() {
  return new Promise((res, rej) => {
    const q = indexedDB.open("valora-brain", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("kv");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function idbGet(k) { try { const db = await idb(); return await new Promise((r) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => r(q.result || null); q.onerror = () => r(null); }); } catch { return null; } }
async function idbSet(k, v) { try { const db = await idb(); await new Promise((r) => { const t = db.transaction("kv", "readwrite"); const s = t.objectStore("kv"); v === null ? s.delete(k) : s.put(v, k); t.oncomplete = r; t.onerror = r; }); } catch {} }
// Accepts my-video, my-video\web or my-video\web\data and finds brain.json inside.
async function findBrain(dir) {
  for (const path of [[], ["data"], ["web", "data"]]) {
    try {
      let d = dir;
      for (const p of path) d = await d.getDirectoryHandle(p);
      const f = await (await d.getFileHandle("brain.json")).getFile();
      return JSON.parse(await f.text());
    } catch {}
  }
  return null;
}
async function loadFolder(dir, quiet) {
  const b = await findBrain(dir);
  if (!b) { if (!quiet) toast("No brain.json there. Choose my-video\\web\\data."); return null; }
  if (!useBrain(b, true, quiet)) return null;
  DIR = dir;
  setFolderBtn(true);
  return dir;
}
function setFolderBtn(connected) { const b = $("folderBtn"); b.hidden = !canFolder; const t = connected ? "Refresh brain data" : "Connect brain data folder"; b.title = t; b.setAttribute("aria-label", t); $("emptyFolder").hidden = !canFolder; }
async function folderClick() {
  try {
    if (DIR) { await loadFolder(DIR); return; }
    const saved = await idbGet("dir");
    if (saved && (await saved.requestPermission({ mode: "read" })) === "granted" && (await loadFolder(saved))) return;
    const dir = await window.showDirectoryPicker({ id: "valora-brain", mode: "read" });
    if (await loadFolder(dir)) await idbSet("dir", dir);
  } catch (e) { if (e && e.name !== "AbortError") toast("Could not open that folder."); }
}
$("folderBtn").onclick = folderClick;
$("emptyFolder").onclick = folderClick;
const pickFile = () => $("file").click();
$("loadBtn").onclick = pickFile;
$("emptyLoad").onclick = pickFile;
$("emptySample").onclick = () => useBrain(JSON.parse($("sample").textContent), false);
$("file").onchange = (e) => { if (e.target.files[0]) readFile(e.target.files[0]); e.target.value = ""; };
let dragDepth = 0;
addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; $("drop").style.display = "flex"; });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").style.display = "none"; } });
addEventListener("dragover", (e) => e.preventDefault());
addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; $("drop").style.display = "none"; const f = e.dataTransfer.files[0]; if (f) readFile(f); });

/* =========================================================
   GEOMETRY
   ========================================================= */
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
const brain = (id) => BRAINS.find((b) => b.id === id);

// Every root a brain has, with its data items, in drawing order.
function rootSpecs() {
  const items = (br, k) => (B && B[br] && B[br].roots && B[br].roots[k]) || [];
  const ytas = YTAS_ROOTS.map(([k, name, color]) => ({ brain: "ytas", key: k, name, label: k, color, items: items("ytas", k) }));
  const videos = Object.entries(VIDEO_PARTS).map(([k, name], i) => ({ brain: "videos", key: k, name, label: `${k} · ${name}`, color: VIDEO_RGB[i], items: items("videos", k) }));
  const shorts = Object.entries(SHORT_PARTS).map(([k, name], i) => ({ brain: "shorts", key: k, name, label: `${k} · ${name}`, color: SHORT_RGB[i], items: items("shorts", k) }));

  const pulsing = allRoots.flatMap((rt) => rt.items.map((it, i) => ({ it, rt, i }))).filter((x) => x.it.state === "pulse");
  openPanel(`${ptop("Summary")}<h2>All four brains</h2>
    <div class="kpis" style="margin-top:12px">
      ${BRAINS.filter((b) => b.id !== "jarvis").map((b) => `<div class="kpi"><b>${count(b.id)}</b><span>${b.name} lit</span></div>`).join("")}
      <div class="kpi"><b style="color:#fff">${pulsing.length}</b><span>Pulsing</span></div>
      <div class="kpi"><b>${esc(fmtDate(B.generated_at))}</b><span>Data date</span></div>
    </div>
    <div class="card"><h2 class="sec">Still pulsing</h2>${pulsing.length ? pulsing.map(({ it, rt }) => `<div class="item-row">${stateDot(it, rt.color)}<div><b>${esc(it.text)}</b><div class="d">${esc(rt.brain.toUpperCase())} · ${esc(rt.brain === "ytas" ? rt.label : rt.label)} · ${vidLink(it)}${it.date ? " · " + esc(fmtDate(it.date)) : ""}</div></div></div>`).join("") : `<p class="muted">Nothing pulsing. Every fix is applied or used.</p>`}</div>`, true);
}
$("dashBtn").onclick = openSummary;
function setLegend(open) { $("legendPop").hidden = !open; $("infoBtn").setAttribute("aria-expanded", String(open)); }
$("infoBtn").onclick = (e) => { e.stopPropagation(); setLegend($("legendPop").hidden); };
document.addEventListener("click", (e) => { if (!e.target.closest("#legendWrap")) setLegend(false); });

/* =========================================================
   SHARED
   ========================================================= */
const fmtDate = (d) => { const t = new Date(d.length === 10 ? d + "T00:00:00" : d); return isNaN(t) ? String(d) : t.toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "numeric" }); };
function renderAll() { $("tagline").textContent = B ? fmtDate(B.generated_at) + (B.sample ? " · sample" : "") : "No brain data loaded"; }
let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = "none"), 3500); }

// For automated checks: counts of lit neurons per root and their states. Read-only.
window.brainMapStats = () => ROOTS.filter((r) => !r.link).map((r) => ({ brain: r.brain, key: r.key, data: r.items.length,
  lit: NEURONS.filter((n) => n.root === r && n.item).length, pulse: NEURONS.filter((n) => n.root === r && n.item && n.item.state === "pulse").length,
  glow: NEURONS.filter((n) => n.root === r && n.item && n.item.state === "glow").length, dim: NEURONS.filter((n) => n.root === r && !n.item).length }))
  .concat(["videos", "shorts"].map((id) => ({ brain: id, key: "all", data: (B ? B[id].roots.all || [] : []).length, lit: HALOS.filter((h) => h.root.brain === id && h.item).length,
    pulse: HALOS.filter((h) => h.root.brain === id && h.item && h.item.state === "pulse").length, glow: HALOS.filter((h) => h.root.brain === id && h.item && h.item.state === "glow").length })));
window.brainMapNeuron = (brainId, key, i) => { const n = NEURONS.filter((x) => x.root.brain === brainId && x.root.key === key && x.item)[i]; return n ? [n.sx, n.sy] : null; };
window.brainMapLoad = (b) => useBrain(b, false, true);

try { const saved = JSON.parse(store.get("valora.brain")); if (saved && !validate(saved)) B = saved; } catch {}
buildMap();
renderAll();
requestAnimationFrame(frame);
(async () => {
  setFolderBtn(false);
  if (!canFolder) return;
  const saved = await idbGet("dir");
  if (!saved) return;
  try { if ((await saved.queryPermission({ mode: "read" })) === "granted") await loadFolder(saved, true); } catch {}
})();
</script>
</body>
</html>
